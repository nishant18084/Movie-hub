<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Nexus OS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Startup Splash -->
  <div id="hello-splash">
    <div>
      <h1 class="hello-text">Hello</h1>
      <p class="hello-sub">Nexus OS 2.5</p>
    </div>
  </div>

  <!-- Real Smartphone Lock Screen -->
  <section id="lock-screen" onclick="unlockDeviceNow()">
    <div class="lock-content">
      <div class="lock-top-info">
        <span id="lock-status-time">--:--</span>
        <span>5G 📶 100% 🔋</span>
      </div>
      <div class="lock-center-widget">
        <p id="lock-date-display">--</p>
        <h1 id="lock-big-clock">--:--</h1>
        <p class="swipe-hint">Tap anywhere to unlock</p>
      </div>
      <div class="lock-bottom-shortcuts">
        <div class="lock-round-btn" onclick="event.stopPropagation(); alert('AI Assistant Ready');">✨</div>
        <div class="lock-round-btn" onclick="event.stopPropagation(); unlockDeviceNow(); openApp('camera');">📷</div>
      </div>
    </div>
  </section>

  <!-- Top Status Bar -->
  <header class="status-bar">
    <span id="top-time">--:--</span>
    <div class="status-icons">
      <span>5G</span>
      <span>📶</span>
      <span>100% 🔋</span>
    </div>
  </header>

  <!-- Home Screen -->
  <main class="home-screen">
    <section class="widget-container">
      <div class="clock-card">
        <h1 id="main-clock">--:--</h1>
        <p id="main-date">--</p>
      </div>
      <div class="weather-chip" onclick="openApp('weather')">
        <span class="weather-icon">⛅</span>
        <div><b>29°C</b><small>AQI 42 • Clear</small></div>
      </div>
    </section>

    <!-- App Grid -->
    <section class="grid-nexus">
      <button class="app-btn" onclick="openPhoneApp()"><div class="icon-box mat-green">📞</div><span class="label">Phone</span></button>
      <button class="app-btn" onclick="openApp('photos')"><div class="icon-box mat-purple">🖼️</div><span class="label">Photos</span></button>
      <button class="app-btn" onclick="openApp('calc')"><div class="icon-box mat-blue">🔢</div><span class="label">Calculator</span></button>
      <button class="app-btn" onclick="openApp('notes')"><div class="icon-box mat-yellow">📝</div><span class="label">Notes</span></button>
      <button class="app-btn" onclick="openApp('weather')"><div class="icon-box mat-sky">☀️</div><span class="label">Weather</span></button>
      <button class="app-btn" onclick="openApp('music')"><div class="icon-box mat-pink">🎵</div><span class="label">Music</span></button>
      <button class="app-btn" onclick="openApp('recorder')"><div class="icon-box mat-red">🎙️</div><span class="label">Recorder</span></button>
      <button class="app-btn" onclick="openApp('settings')"><div class="icon-box mat-zinc">⚙️</div><span class="label">Settings</span></button>
    </section>
  </main>

  <!-- Bottom Dock -->
  <nav class="dock">
    <button class="app-btn" onclick="openPhoneApp()"><div class="icon-box mat-green">📞</div></button>
    <button class="app-btn" onclick="openApp('browser')"><div class="icon-box mat-sky">🌐</div></button>
    <button class="app-btn" onclick="openApp('camera')"><div class="icon-box mat-slate">📷</div></button>
    <button class="app-btn" onclick="openApp('settings')"><div class="icon-box mat-zinc">⚙️</div></button>
  </nav>

  <!-- Navigation Bar -->
  <footer class="nav-bar">
    <div class="nav-btn" onclick="openApp('settings')">⏹</div>
    <div class="nav-btn" onclick="closeAllModals()">⚪</div>
    <div class="nav-btn" onclick="closeAllModals()">◀</div>
  </footer>

  <!-- Phone / Calling App Window -->
  <div id="phone-app-window">
    <div class="phone-tabs">
      <button class="phone-tab-btn active" id="tab-dialer-btn" onclick="switchPhoneTab('keypad')">Keypad</button>
      <button class="phone-tab-btn" id="tab-recents-btn" onclick="switchPhoneTab('recents')">Recents</button>
      <button onclick="closePhoneApp()" style="background:none; border:none; color:var(--accent); font-size:14px; font-weight:600; padding-right:12px; cursor:pointer;">Close ✕</button>
    </div>

    <!-- Keypad Tab -->
    <div id="phone-keypad-view" style="flex:1; display:flex; flex-direction:column;">
      <div class="dialer-display">
        <div id="dial-input"></div>
      </div>

      <div class="dialpad-grid">
        <div class="dial-key" onclick="pressKey('1')"><b>1</b><span></span></div>
        <div class="dial-key" onclick="pressKey('2')"><b>2</b><span>ABC</span></div>
        <div class="dial-key" onclick="pressKey('3')"><b>3</b><span>DEF</span></div>
        <div class="dial-key" onclick="pressKey('4')"><b>4</b><span>GHI</span></div>
        <div class="dial-key" onclick="pressKey('5')"><b>5</b><span>JKL</span></div>
        <div class="dial-key" onclick="pressKey('6')"><b>6</b><span>MNO</span></div>
        <div class="dial-key" onclick="pressKey('7')"><b>7</b><span>PQRS</span></div>
        <div class="dial-key" onclick="pressKey('8')"><b>8</b><span>TUV</span></div>
        <div class="dial-key" onclick="pressKey('9')"><b>9</b><span>WXYZ</span></div>
        <div class="dial-key" onclick="pressKey('*')"><b>*</b></div>
        <div class="dial-key" onclick="pressKey('0')"><b>0</b><span>+</span></div>
        <div class="dial-key" onclick="pressKey('#')"><b>#</b></div>
      </div>

      <div class="dial-actions">
        <div style="width:48px;"></div>
        <button class="call-trigger-btn" onclick="startCall(currentDialedNumber || 'Customer Support')">📞</button>
        <button class="call-del-btn" onclick="deleteKey()">⌫</button>
      </div>
    </div>

    <!-- Recents Tab -->
    <div id="phone-recents-view" style="flex:1; display:none; padding:16px; overflow-y:auto;">
      <h3 style="font-size:15px; color:var(--muted); margin-bottom:12px;">Call History</h3>
      <div id="recents-list" style="display:flex; flex-direction:column; gap:8px;"></div>
    </div>
  </div>

  <!-- Active Call Screen Overlay -->
  <div id="active-call-overlay">
    <div>
      <div class="caller-avatar">👤</div>
      <h2 id="live-caller-name" class="call-name">User</h2>
      <p id="live-call-status" class="call-timer">Calling...</p>
    </div>

    <div>
      <div class="call-tools">
        <button class="tool-btn" id="mute-btn" onclick="toggleMute()">🎙️</button>
        <button class="tool-btn" id="speaker-btn" onclick="toggleSpeaker()">🔊</button>
        <button class="tool-btn" onclick="alert('Keypad in call ready')">⌨️</button>
      </div>
      <button class="end-call-btn" onclick="endOngoingCall()">📞</button>
    </div>
  </div>

  <!-- System Modal Window (Photos, Settings, Calc) -->
  <section id="app-modal">
    <div class="modal-hdr">
      <button class="back-btn" onclick="closeApp()">‹ Back</button>
      <h3 id="modal-title">APP</h3>
      <div style="width:40px;"></div>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </section>

  <!-- Power Menu Overlay -->
  <div id="power-overlay">
    <div class="power-card">
      <h3 style="font-size:18px; margin-bottom:4px;">Power Options</h3>
      <button class="p-btn p-restart" onclick="restartDevice()">🔄 Restart</button>
      <button class="p-btn p-off" onclick="powerOffDevice()">⚡ Power Off</button>
      <button class="p-btn p-cancel" onclick="hidePowerMenu()">Cancel</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
