<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instant Temp Mail Launcher</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #131b2e;
      --card-border: #202d4a;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --accent: #818cf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #22c55e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 1.25rem 2rem;
      background: rgba(19, 27, 46, 0.8);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-weight: 800;
      font-size: 1.35rem;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .badge {
      font-size: 0.75rem;
      background: rgba(56, 189, 248, 0.15);
      color: var(--primary);
      padding: 0.25rem 0.6rem;
      border-radius: 20px;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    main {
      flex: 1;
      max-width: 900px;
      width: 100%;
      margin: 2rem auto;
      padding: 0 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .generator-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 1rem;
      padding: 1.75rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .email-display-box {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      background: #090d16;
      border: 1px solid var(--card-border);
      padding: 0.5rem 0.75rem;
      border-radius: 0.6rem;
    }

    .email-display-box input {
      flex: 1;
      background: transparent;
      border: none;
      color: #38bdf8;
      font-size: 1.15rem;
      font-weight: 600;
      outline: none;
      width: 100%;
    }

    .action-btns {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .btn {
      padding: 0.65rem 1.2rem;
      border-radius: 0.5rem;
      font-weight: 600;
      font-size: 0.9rem;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--primary);
      color: #090d16;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
      color: #fff;
    }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--card-border);
      color: var(--text);
    }

    .btn-outline:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: var(--primary);
    }

    .inbox-container {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 1rem;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .inbox-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 0.75rem;
    }

    .inbox-title {
      font-size: 1.1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .auto-refresh-tag {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .mail-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      min-height: 150px;
    }

    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .mail-item {
      background: #0d1424;
      border: 1px solid var(--card-border);
      border-radius: 0.6rem;
      padding: 1rem;
      cursor: pointer;
      transition: border-color 0.2s, transform 0.1s;
    }

    .mail-item:hover {
      border-color: var(--primary);
      transform: translateY(-1px);
    }

    .mail-item-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.4rem;
      font-size: 0.85rem;
    }

    .mail-sender {
      color: var(--primary);
      font-weight: 600;
    }

    .mail-date {
      color: var(--text-muted);
    }

    .mail-subject {
      font-weight: 600;
      color: #fff;
      font-size: 1rem;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 1rem;
      width: 100%;
      max-width: 700px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      overflow: hidden;
    }

    .modal-header {
      padding: 1.25rem;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .modal-body {
      padding: 1.25rem;
      overflow-y: auto;
      color: var(--text);
      line-height: 1.6;
      font-size: 0.95rem;
      background: #090d16;
      margin: 1rem;
      border-radius: 0.5rem;
      border: 1px solid var(--card-border);
    }

    .close-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.5rem;
      cursor: pointer;
      line-height: 1;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--success);
      color: #090d16;
      font-weight: 700;
      padding: 0.75rem 1.25rem;
      border-radius: 0.5rem;
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.3s;
      pointer-events: none;
      z-index: 1000;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    footer {
      text-align: center;
      padding: 1.5rem;
      color: var(--text-muted);
      font-size: 0.85rem;
      border-top: 1px solid var(--card-border);
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      📬 Instant Temp Mail
      <span class="badge">Launcher</span>
    </div>
  </header>

  <main>
    <section class="generator-card">
      <div style="font-size: 0.95rem; color: var(--text-muted);">Aapka Temporary Disposable Email Address:</div>
      <div class="email-display-box">
        <input type="text" id="emailInput" readonly value="Generating email...">
      </div>
      <div class="action-btns">
        <button class="btn btn-primary" onclick="copyEmail()">📋 Copy Address</button>
        <button class="btn btn-outline" onclick="generateNewEmail()">🔄 Generate New Email</button>
        <button class="btn btn-outline" onclick="checkInbox(true)">⚡ Refresh Inbox</button>
      </div>
    </section>

    <section class="inbox-container">
      <div class="inbox-header">
        <div class="inbox-title">
          📥 Incoming Messages <span id="mailCount" class="badge">0</span>
        </div>
        <div class="auto-refresh-tag" id="statusIndicator">⏳ Auto-checking in 5s...</div>
      </div>

      <div class="mail-list" id="mailList">
        <div class="empty-state">
          Inbox empty hai. OTP ya mail aane par yahan automatically show hoga.
        </div>
      </div>
    </section>
  </main>

  <div class="modal-overlay" id="mailModal">
    <div class="modal-card">
      <div class="modal-header">
        <div>
          <h3 id="modalSubject" style="color: var(--primary); margin-bottom: 0.25rem;">Subject</h3>
          <div id="modalFrom" style="font-size: 0.85rem; color: var(--text-muted);">From: sender</div>
          <div id="modalDate" style="font-size: 0.75rem; color: var(--text-muted);">Date</div>
        </div>
        <button class="close-btn" onclick="closeModal()">&times;</button>
      </div>
      <div class="modal-body" id="modalContent"></div>
    </div>
  </div>

  <div class="toast" id="toast">Copied to clipboard!</div>

  <footer>
    &copy; 2026 Instant Disposable Mail Launcher. Free & Privacy First.
  </footer>

  <script>
    let currentLogin = '';
    let currentDomain = '';
    let countdown = 5;

    const emailInput = document.getElementById('emailInput');
    const mailList = document.getElementById('mailList');
    const mailCount = document.getElementById('mailCount');
    const statusIndicator = document.getElementById('statusIndicator');
    const toast = document.getElementById('toast');

    async function generateNewEmail() {
      emailInput.value = "Generating new address...";
      try {
        const res = await fetch("https://www.1secmail.com/api/v1/?action=genRandomMailbox&count=1");
        const data = await res.json();
        const fullEmail = data[0];
        const [login, domain] = fullEmail.split('@');
        currentLogin = login;
        currentDomain = domain;
        emailInput.value = fullEmail;
        localStorage.setItem('saved_temp_login', login);
        localStorage.setItem('saved_temp_domain', domain);
        checkInbox();
      } catch (err) {
        const domains = ["1secmail.com", "1secmail.org", "1secmail.net"];
        currentDomain = domains[Math.floor(Math.random() * domains.length)];
        currentLogin = "user_" + Math.random().toString(36).substring(2, 10);
        emailInput.value = `${currentLogin}@${currentDomain}`;
        checkInbox();
      }
    }

    async function checkInbox(manual = false) {
      if (!currentLogin || !currentDomain) return;

      if (manual) statusIndicator.innerText = "Checking...";

      try {
        const url = `https://www.1secmail.com/api/v1/?action=getMessages&login=${currentLogin}&domain=${currentDomain}`;
        const res = await fetch(url);
        const messages = await res.json();

        renderMailList(messages);
      } catch (err) {
        console.error("Inbox fetch error:", err);
      }
    }

    function renderMailList(messages) {
      mailCount.innerText = messages ? messages.length : 0;

      if (!messages || messages.length === 0) {
        mailList.innerHTML = `
          <div class="empty-state">
            Inbox empty hai. OTP ya mail aane par yahan automatically show hoga.
          </div>
        `;
        return;
      }

      mailList.innerHTML = '';
      messages.forEach(msg => {
        const item = document.createElement('div');
        item.className = 'mail-item';
        item.innerHTML = `
          <div class="mail-item-header">
            <span class="mail-sender">${escapeHtml(msg.from)}</span>
            <span class="mail-date">${msg.date}</span>
          </div>
          <div class="mail-subject">${escapeHtml(msg.subject || '(No Subject)')}</div>
        `;
        item.onclick = () => openEmail(msg.id);
        mailList.appendChild(item);
      });
    }

    async function openEmail(id) {
      try {
        const url = `https://www.1secmail.com/api/v1/?action=readMessage&login=${currentLogin}&domain=${currentDomain}&id=${id}`;
        const res = await fetch(url);
        const data = await res.json();

        document.getElementById('modalSubject').innerText = data.subject || '(No Subject)';
        document.getElementById('modalFrom').innerText = `From: ${data.from}`;
        document.getElementById('modalDate').innerText = `Date: ${data.date}`;
        
        const contentDiv = document.getElementById('modalContent');
        if (data.htmlBody) {
          contentDiv.innerHTML = data.htmlBody;
        } else {
          contentDiv.innerText = data.textBody || '(No content)';
        }

        document.getElementById('mailModal').classList.add('active');
      } catch (err) {
        alert("Email load nahi ho paya.");
      }
    }

    function closeModal() {
      document.getElementById('mailModal').classList.remove('active');
    }

    function copyEmail() {
      if (!emailInput.value || emailInput.value.includes('...')) return;
      navigator.clipboard.writeText(emailInput.value);
      showToast("Email address copied!");
    }

    function showToast(msg) {
      toast.innerText = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.innerText = text;
      return div.innerHTML;
    }

    setInterval(() => {
      countdown--;
      if (countdown <= 0) {
        checkInbox();
        countdown = 5;
      }
      statusIndicator.innerText = `⏳ Auto-checking in ${countdown}s...`;
    }, 1000);

    window.addEventListener('DOMContentLoaded', () => {
      const savedLogin = localStorage.getItem('saved_temp_login');
      const savedDomain = localStorage.getItem('saved_temp_domain');

      if (savedLogin && savedDomain) {
        currentLogin = savedLogin;
        currentDomain = savedDomain;
        emailInput.value = `${currentLogin}@${currentDomain}`;
        checkInbox();
      } else {
        generateNewEmail();
      }
    });
  </script>
</body>
</html>
