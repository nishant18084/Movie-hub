<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Nexus OS</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #070a12;
      color: #fff;
    }

    /* 1. HELLO BOOT ANIMATION */
    #boot-screen {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      animation: hideBoot 0.5s ease 2.0s forwards;
      pointer-events: none;
    }

    .hello-svg { width: 260px; max-width: 80vw; }
    .hello-text {
      font-family: 'Brush Script MT', 'Segoe Script', cursive, sans-serif;
      font-size: 85px;
      fill: transparent;
      stroke: #38bdf8;
      stroke-width: 2.2;
      stroke-dasharray: 600;
      stroke-dashoffset: 600;
      stroke-linecap: round;
      animation: writeHello 1.8s ease-in-out forwards;
      filter: drop-shadow(0 0 12px rgba(56, 189, 248, 0.7));
    }

    @keyframes writeHello {
      0% { stroke-dashoffset: 600; fill: transparent; }
      75% { stroke-dashoffset: 0; fill: transparent; }
      100% { stroke-dashoffset: 0; fill: #38bdf8; }
    }

    @keyframes hideBoot {
      to { opacity: 0; visibility: hidden; }
    }

    /* 2. MAIN OS SCREEN */
    #main-os {
      width: 100%;
      height: 100dvh;
      background: linear-gradient(180deg, #131929 0%, #070a12 100%);
      padding: env(safe-area-inset-top, 16px) 20px env(safe-area-inset-bottom, 16px) 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: #94a3b8;
      padding-top: 4px;
    }

    .time-card {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(14px);
      border-radius: 24px;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .time-card h1 { font-size: 42px; line-height: 1; font-weight: 600; }
    .time-card p { font-size: 13px; color: #94a3b8; margin-top: 6px; }
    .os-badge { color: #f59e0b; font-weight: 700; font-size: 15px; }

    .search-box {
      width: 100%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 13px 16px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    .search-box::placeholder { color: #64748b; }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px 12px;
      margin-top: 8px;
    }

    .app-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
    }

    .icon {
      width: 60px;
      height: 60px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      box-shadow: 0 6px 14px rgba(0,0,0,0.35);
      transition: transform 0.1s ease;
    }
    .app-item:active .icon { transform: scale(0.9); }
    .label { font-size: 12px; color: #e2e8f0; margin-top: 7px; text-align: center; }

    .bg-green { background: #22c55e; }
    .bg-blue { background: #0284c7; }
    .bg-slate { background: #475569; }
    .bg-yellow { background: #eab308; }
    .bg-sky { background: #38bdf8; }
    .bg-rose { background: #e11d48; }
    .bg-zinc { background: #52525b; }

    /* 3. APP MODAL WINDOW */
    #app-window {
      position: fixed;
      inset: 0;
      background: #080c16;
      z-index: 200;
      display: none;
      flex-direction: column;
    }
    #app-window.window-active { display: flex !important; }

    .window-header {
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .back-btn {
      background: transparent;
      border: none;
      color: #38bdf8;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .window-content { flex: 1; overflow-y: auto; padding: 20px; }

    /* Settings UI */
    .settings-container { display: flex; flex-direction: column; gap: 14px; padding-bottom: 30px; }
    .settings-card { background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; overflow: hidden; }
    .settings-item { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); cursor: pointer; }
    .settings-item:last-child { border-bottom: none; }
    .item-left { display: flex; align-items: center; gap: 14px; }
    .s-icon { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; color: #fff; }
    .s-title { font-size: 15px; color: #f1f5f9; font-weight: 500; }
    .item-right { display: flex; align-items: center; gap: 8px; font-size: 14px; color: #94a3b8; }
    .arrow { color: #64748b; font-size: 16px; font-weight: 600; }

    .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; inset: 0; background-color: #334155; transition: .3s; border-radius: 24px; }
    .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
    input:checked + .slider { background-color: #22c55e; }
    input:checked + .slider:before { transform: translateX(20px); }

    /* Calculator */
    .calc-screen { background: rgba(255, 255, 255, 0.05); padding: 24px 16px; border-radius: 16px; font-size: 36px; text-align: right; margin-bottom: 20px; min-height: 80px; }
    .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .calc-btn { padding: 16px 0; border-radius: 14px; border: none; background: #1e293b; color: #fff; font-size: 20px; font-weight: 600; cursor: pointer; }
    .calc-btn.op { background: #f59e0b; color: #000; }
    .calc-btn.action { background: #475569; }

    /* Dialer */
    .dialer-screen { font-size: 32px; font-weight: 600; text-align: center; min-height: 48px; margin-bottom: 16px; }
    .dial-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; max-width: 300px; margin: 0 auto; }
    .dial-btn { height: 64px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, 0.1); background: rgba(255, 255, 255, 0.08); color: #fff; font-size: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; }
    .dial-sub { font-size: 9px; color: #94a3b8; }
  </style>
</head>
<body>

  <!-- 1. Boot Hello Layer -->
  <div id="boot-screen">
    <svg class="hello-svg" viewBox="0 0 300 120">
      <text x="50%" y="65%" text-anchor="middle" dominant-baseline="middle" class="hello-text">
        hello
      </text>
    </svg>
  </div>

  <!-- 2. Main OS Screen -->
  <main id="main-os">
    <header class="status-bar">
      <span id="live-status-time">--:--</span>
      <div style="display:flex; gap:8px;">
        <span>VoLTE 5G</span>
        <span>100%</span>
      </div>
    </header>

    <section class="time-card">
      <div>
        <h1 id="live-clock">--:--</h1>
        <p id="live-date">Sunday, Aug 16</p>
      </div>
      <span class="os-badge">⚡ NEXUS OS</span>
    </section>

    <input type="text" id="app-search" class="search-box" placeholder="Search system, apps, tools..." oninput="filterApps()">

    <section class="grid" id="home-grid">
      <div class="app-item" onclick="openApp('dialer')">
        <div class="icon bg-green">📞</div>
        <span class="label">Phone</span>
      </div>
      <div class="app-item" onclick="openApp('camera')">
        <div class="icon bg-slate">📷</div>
        <span class="label">Camera</span>
      </div>
      <div class="app-item" onclick="openApp('calc')">
        <div class="icon bg-blue">🔢</div>
        <span class="label">Calculator</span>
      </div>
      <div class="app-item" onclick="openApp('notes')">
        <div class="icon bg-yellow">📝</div>
        <span class="label">Notes</span>
      </div>
      <div class="app-item" onclick="openApp('weather')">
        <div class="icon bg-sky">☀️</div>
        <span class="label">Weather</span>
      </div>
      <div class="app-item" onclick="openApp('watch')">
        <div class="icon bg-rose">⏱️</div>
        <span class="label">Watch</span>
      </div>
      <div class="app-item" onclick="openApp('settings')">
        <div class="icon bg-zinc">⚙️</div>
        <span class="label">Settings</span>
      </div>
    </section>
  </main>

  <!-- 3. App Window System -->
  <section id="app-window">
    <div class="window-header">
      <button class="back-btn" onclick="closeApp()">‹ Back</button>
      <h3 id="window-title">App</h3>
      <div style="width: 50px;"></div>
    </div>
    <div class="window-content" id="window-content"></div>
  </section>

  <!-- Direct Runtime Logic -->
  <script>
    let mediaStream = null;
    let currentFacingMode = "environment";
    let calcBuffer = '';
    let dialPadStr = '';
    let swTimer = null, swElapsed = 0, isSwRunning = false;

    // Instant clock execution
    function updateClock() {
      const now = new Date();
      const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
      const dateStr = now.toLocaleDateString([], { weekday: 'long', month: 'short', day: 'numeric' });
      
      const st = document.getElementById('live-status-time');
      const lc = document.getElementById('live-clock');
      const ld = document.getElementById('live-date');

      if (st) st.innerText = timeStr;
      if (lc) lc.innerText = timeStr;
      if (ld) ld.innerText = dateStr;
    }
    updateClock();
    setInterval(updateClock, 1000);

    function filterApps() {
      const q = document.getElementById('app-search').value.toLowerCase();
      document.querySelectorAll('#home-grid .app-item').forEach(item => {
        const label = item.querySelector('.label').innerText.toLowerCase();
        item.style.display = label.includes(q) ? 'flex' : 'none';
      });
    }

    // App Open System
    function openApp(appName) {
      const win = document.getElementById('app-window');
      const title = document.getElementById('window-title');
      const content = document.getElementById('window-content');
      if (!win || !title || !content) return;

      win.classList.add('window-active');

      switch(appName) {
        case 'settings':
          title.innerText = "Settings";
          content.innerHTML = `
            <div class="settings-container">
              <!-- Group 1: Connectivity -->
              <div class="settings-card">
                <div class="settings-item">
                  <div class="item-left"><div class="s-icon" style="background:#f59e0b;">✈️</div><span class="s-title">Aeroplane mode</span></div>
                  <label class="switch"><input type="checkbox"><span class="slider"></span></label>
                </div>
                <div class="settings-item" onclick="alert('Wi-Fi is scanning...')">
                  <div class="item-left"><div class="s-icon" style="background:#0284c7;">📶</div><span class="s-title">Wi-Fi</span></div>
                  <div class="item-right"><span>Off</span><span class="arrow">›</span></div>
                </div>
                <div class="settings-item" onclick="alert('Bluetooth is scanning...')">
                  <div class="item-left"><div class="s-icon" style="background:#2563eb;">ᛒ</div><span class="s-title">Bluetooth</span></div>
                  <div class="item-right"><span>Off</span><span class="arrow">›</span></div>
                </div>
                <div class="settings-item" onclick="alert('SIM 5G Active')">
                  <div class="item-left"><div class="s-icon" style="background:#16a34a;">⇅</div><span class="s-title">Mobile network</span></div>
                  <div class="item-right"><span class="arrow">›</span></div>
                </div>
              </div>

              <!-- Group 2: Personalisation & Display -->
              <div class="settings-card">
                <div class="settings-item" onclick="alert('Wallpapers & Style')">
                  <div class="item-left"><div class="s-icon" style="background:#ea580c;">🎨</div><span class="s-title">Home screen, Lock screen & style</span></div>
                  <div class="item-right"><span class="arrow">›</span></div>
                </div>
                <div class="settings-item" onclick="alert('Display: Dark Mode Active')">
                  <div class="item-left"><div class="s-icon" style="background:#eab308;">☀️</div><span class="s-title">Display & brightness</span></div>
                  <div class="item-right"><span class="arrow">›</span></div>
                </div>
              </div>

              <!-- Group 3: Sound & Notifications -->
              <div class="settings-card">
                <div class="settings-item" onclick="alert('Volume: 100%')">
                  <div class="item-left"><div class="s-icon" style="background:#22c55e;">🔔</div><span class="s-title">Sound & vibration</span></div>
                  <div class="item-right"><span class="arrow">›</span></div>
                </div>
                <div class="settings-item" onclick="alert('Notifications Active')">
                  <div class="item-left"><div class="s-icon" style="background:#0284c7;">💬</div><span class="s-title">Notifications & Quick Settings</span></div>
                  <div class="item-right"><span class="arrow">›</span></div>
                </div>
              </div>

              <!-- Group 4: Device Info -->
              <div class="settings-card">
                <div class="settings-item" onclick="openAboutDevice()">
                  <div class="item-left"><div class="s-icon" style="background:#16a34a;">📱</div><span class="s-title">About device</span></div>
                  <div class="item-right"><span>Nexus Alpha</span><span class="arrow">›</span></div>
                </div>
              </div>
            </div>
          `;
          break;

        case 'camera':
          title.innerText = "Camera";
          content.innerHTML = `
            <div style="display:flex; flex-direction:column; height:100%; justify-content:space-between;">
              <div style="position:relative; width:100%; height:62vh; background:#000; border-radius:24px; overflow:hidden;">
                <video id="cam-feed" autoplay playsinline muted style="width:100%; height:100%; object-fit:cover;"></video>
                <div id="cam-flash" style="position:absolute; inset:0; background:white; opacity:0; pointer-events:none; transition:opacity 0.15s;"></div>
              </div>
              <canvas id="cam-canvas" style="display:none;"></canvas>
              <div style="display:flex; justify-content:space-around; align-items:center; padding:16px 10px;">
                <img id="cam-thumb" style="width:52px; height:52px; border-radius:14px; object-fit:cover; border:2px solid rgba(255,255,255,0.2); background:#1e293b;" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='52' height='52' fill='%23334155'><rect width='52' height='52'/></svg>">
                <button onclick="takePhoto()" style="width:72px; height:72px; border-radius:50%; border:4px solid #fff; background:transparent; padding:3px; cursor:pointer;">
                  <div style="width:100%; height:100%; background:#fff; border-radius:50%;"></div>
                </button>
                <button onclick="flipCamera()" style="width:52px; height:52px; border-radius:50%; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); color:#fff; font-size:22px; cursor:pointer;">🔄</button>
              </div>
            </div>
          `;
          startCameraFeed();
          break;

        case 'dialer':
          title.innerText = "Phone";
          dialPadStr = '';
          content.innerHTML = `
            <div class="dialer-screen" id="dial-number"></div>
            <div class="dial-grid">
              <div class="dial-btn" onclick="dialDigit('1')">1<span class="dial-sub">.</span></div>
              <div class="dial-btn" onclick="dialDigit('2')">2<span class="dial-sub">ABC</span></div>
              <div class="dial-btn" onclick="dialDigit('3')">3<span class="dial-sub">DEF</span></div>
              <div class="dial-btn" onclick="dialDigit('4')">4<span class="dial-sub">GHI</span></div>
              <div class="dial-btn" onclick="dialDigit('5')">5<span class="dial-sub">JKL</span></div>
              <div class="dial-btn" onclick="dialDigit('6')">6<span class="dial-sub">MNO</span></div>
              <div class="dial-btn" onclick="dialDigit('7')">7<span class="dial-sub">PQRS</span></div>
              <div class="dial-btn" onclick="dialDigit('8')">8<span class="dial-sub">TUV</span></div>
              <div class="dial-btn" onclick="dialDigit('9')">9<span class="dial-sub">WXYZ</span></div>
              <div class="dial-btn" onclick="dialDigit('*')">*</div>
              <div class="dial-btn" onclick="dialDigit('0')">0<span class="dial-sub">+</span></div>
              <div class="dial-btn" onclick="dialDigit('#')">#</div>
              <div class="dial-btn" onclick="dialClear()" style="font-size:18px;">⌫</div>
              <div class="dial-btn" onclick="if(dialPadStr) window.location.href='tel:'+dialPadStr" style="background:#22c55e;">📞</div>
              <div></div>
            </div>
          `;
          break;

        case 'calc':
          title.innerText = "Calculator";
          calcBuffer = '';
          content.innerHTML = `
            <div class="calc-screen" id="calc-display">0</div>
            <div class="calc-grid">
              <button class="calc-btn action" onclick="calcAction('C')">C</button>
              <button class="calc-btn action" onclick="calcAction('DEL')">⌫</button>
              <button class="calc-btn op" onclick="calcAction('/')">/</button>
              <button class="calc-btn op" onclick="calcAction('*')">×</button>
              <button class="calc-btn" onclick="calcAction('7')">7</button>
              <button class="calc-btn" onclick="calcAction('8')">8</button>
              <button class="calc-btn" onclick="calcAction('9')">9</button>
              <button class="calc-btn op" onclick="calcAction('-')">-</button>
              <button class="calc-btn" onclick="calcAction('4')">4</button>
              <button class="calc-btn" onclick="calcAction('5')">5</button>
              <button class="calc-btn" onclick="calcAction('6')">6</button>
              <button class="calc-btn op" onclick="calcAction('+')">+</button>
              <button class="calc-btn" onclick="calcAction('1')">1</button>
              <button class="calc-btn" onclick="calcAction('2')">2</button>
              <button class="calc-btn" onclick="calcAction('3')">3</button>
              <button class="calc-btn op" onclick="calcAction('=')">=</button>
              <button class="calc-btn" style="grid-column: span 2;" onclick="calcAction('0')">0</button>
              <button class="calc-btn" onclick="calcAction('.')">.</button>
            </div>
          `;
          break;

        case 'notes':
          title.innerText = "Quick Notes";
          const
