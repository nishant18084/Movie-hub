<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nexus OS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top Info Area -->
  <div class="top-section">
    <div class="status-bar">
      <span id="top-time">--:--</span>
      <span>VoLTE 5G • 100%</span>
    </div>

    <div class="time-widget">
      <div>
        <h1 id="main-clock">--:--</h1>
        <p id="main-date">--</p>
      </div>
      <span class="badge">⚡ NEXUS</span>
    </div>

    <!-- Main 8-App Grid -->
    <div class="grid" id="home-grid">
      <button class="app-btn" onclick="openApp('photos')"><div class="icon bg-purple">🖼️</div><span class="label">Photos</span></button>
      <button class="app-btn" onclick="openApp('calc')"><div class="icon bg-blue">🔢</div><span class="label">Calculator</span></button>
      <button class="app-btn" onclick="openApp('notes')"><div class="icon bg-yellow">📝</div><span class="label">Notes</span></button>
      <button class="app-btn" onclick="openApp('weather')"><div class="icon bg-sky">☀️</div><span class="label">Weather</span></button>
      <button class="app-btn" onclick="openApp('music')"><div class="icon bg-pink">🎵</div><span class="label">Music</span></button>
      <button class="app-btn" onclick="openApp('recorder')"><div class="icon bg-red">🎙️</div><span class="label">Recorder</span></button>
      <button class="app-btn" onclick="openApp('files')"><div class="icon bg-amber">📁</div><span class="label">Files</span></button>
      <button class="app-btn" onclick="openApp('drivers')"><div class="icon bg-cyan">🎛️</div><span class="label">Drivers</span></button>
    </div>
  </div>

  <!-- Bottom Area -->
  <div class="bottom-section">
    <nav class="dock">
      <button class="app-btn" onclick="openApp('dialer')"><div class="icon bg-green">📞</div></button>
      <button class="app-btn" onclick="openApp('browser')"><div class="icon bg-sky">🌐</div></button>
      <button class="app-btn" onclick="openApp('camera')"><div class="icon bg-slate">📷</div></button>
      <button class="app-btn" onclick="openApp('settings')"><div class="icon bg-zinc">⚙️</div></button>
    </nav>

    <!-- 3-Button Navigation Bar (Realme Layout: Recents, Home, Back) -->
    <footer class="nav-bar">
      <div class="nav-btn" onclick="alert('Recents: Background tasks active')">⏹</div>
      <div class="nav-btn" onclick="closeApp()">⚪</div>
      <div class="nav-btn" onclick="closeApp()">◀</div>
    </footer>
  </div>

  <!-- App Window Modal -->
  <section id="app-modal">
    <div class="modal-hdr" id="modal-hdr">
      <button class="back-btn" onclick="closeApp()">‹ Back</button>
      <h3 id="modal-title">App</h3>
      <div style="width: 40px;"></div>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </section>

  <script src="script.js"></script>
</body>
</html>
