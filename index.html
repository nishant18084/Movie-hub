<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Nexus OS</title>
  <style>
    :root {
      --bg: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #090d16 60%, #030712 100%);
      --glass: rgba(255, 255, 255, 0.08);
      --border: rgba(255, 255, 255, 0.12);
      --accent: #38bdf8;
      --green: #22c55e;
      --red: #ef4444;
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg);
      background-size: cover;
      background-position: center;
      color: var(--text);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: env(safe-area-inset-top, 12px) 16px 0 16px;
    }

    /* Lock Screen */
    #lock-screen {
      position: fixed;
      inset: 0;
      background: inherit;
      background-size: cover;
      background-position: center;
      z-index: 50000;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px 20px 24px 20px;
      cursor: pointer;
      transition: transform 0.35s ease, opacity 0.3s ease;
    }
    #lock-screen::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      z-index: 1;
    }
    .lock-content {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .lock-top-info { display: flex; justify-content: space-between; font-size: 13px; color: #fff; font-weight: 600; }
    .lock-center-widget { text-align: center; margin-top: 40px; }
    #lock-date-display { font-size: 16px; font-weight: 600; color: #fff; margin-bottom: 4px; }
    #lock-big-clock { font-size: 82px; font-weight: 800; line-height: 1; color: #fff; letter-spacing: -2px; }
    .swipe-hint { font-size: 13px; color: rgba(255, 255, 255, 0.85); margin-top: 14px; }
    .lock-bottom-shortcuts { display: flex; justify-content: space-between; align-items: center; padding: 0 10px; }
    .lock-round-btn {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      cursor: pointer;
    }

    /* Top Status Bar */
    .status-bar { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); font-weight: 600; }
    .status-icons { display: flex; align-items: center; gap: 6px; font-size: 12px; }

    /* Home Screen */
    .home-screen { flex: 1; display: flex; flex-direction: column; gap: 16px; margin-top: 10px; }
    .widget-container { display: flex; gap: 12px; }
    .clock-card {
      flex: 2;
      background: var(--glass);
      border: 1px solid var(--border);
      backdrop-filter: blur(25px);
      border-radius: 26px;
      padding: 18px 20px;
    }
    .clock-card h1 { font-size: 40px; line-height: 1; font-weight: 700; }
    .clock-card p { font-size: 13px; color: var(--muted); margin-top: 6px; }

    .weather-chip {
      flex: 1;
      background: var(--glass);
      border: 1px solid var(--border);
      backdrop-filter: blur(25px);
      border-radius: 26px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
    }
    .weather-icon { font-size: 24px; }
    .weather-chip b { font-size: 16px; display: block; }
    .weather-chip small { color: var(--green); font-weight: 600; font-size: 11px; }

    /* Grid */
    .grid-nexus { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px 10px; }
    .app-btn { background: transparent; border: none; display: flex; flex-direction: column; align-items: center; cursor: pointer; }
    .app-btn:active .icon-box { transform: scale(0.88); }
    .icon-box {
      width: 58px;
      height: 58px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: none;
    }
    .label { font-size: 12px; color: var(--text); margin-top: 6px; text-align: center; font-weight: 500; pointer-events: none; }

    .mat-green { background: linear-gradient(135deg, #22c55e, #15803d); }
    .mat-green-wa { background: linear-gradient(135deg, #25d366, #128c7e); }
    .mat-purple { background: linear-gradient(135deg, #a855f7, #6b21a8); }
    .mat-blue { background: linear-gradient(135deg, #0284c7, #0369a1); }
    .mat-yellow { background: linear-gradient(135deg, #f59e0b, #d97706); }
    .mat-sky { background: linear-gradient(135deg, #38bdf8, #0284c7); }
    .mat-pink { background: linear-gradient(135deg, #ec4899, #be185d); }
    .mat-red { background: linear-gradient(135deg, #ef4444, #b91c1c); }
    .mat-zinc { background: linear-gradient(135deg, #64748b, #334155); }
    .mat-slate { background: linear-gradient(135deg, #475569, #1e293b); }

    /* Dock */
    .dock {
      background: var(--glass);
      backdrop-filter: blur(30px);
      border: 1px solid var(--border);
      border-radius: 28px;
      height: 72px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin-bottom: 8px;
    }
    .nav-bar { height: 42px; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid rgba(255, 255, 255, 0.05); }
    .nav-btn { font-size: 16px; color: var(--muted); padding: 8px 30px; cursor: pointer; }

    /* App Modal Generic */
    #app-modal {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      background: #030712;
      z-index: 2000;
      display: none;
      flex-direction: column;
      padding: env(safe-area-inset-top, 12px) 16px env(safe-area-inset-bottom, 12px) 16px;
    }
    .modal-hdr { padding: 12px 6px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
    .back-btn { background: transparent; border: none; color: var(--accent); font-size: 16px; font-weight: 600; cursor: pointer; }
    .modal-body { flex: 1; overflow-y: auto; padding: 16px 4px; }

    /* PHONE / CALLING APP SCREEN */
    #phone-app-window {
      position: fixed;
      inset: 0;
      background: #0b0f19;
      z-index: 3000;
      display: none;
      flex-direction: column;
    }
    .phone-tabs { display: flex; justify-content: space-around; background: #111827; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .phone-tab-btn { background: none; border: none; color: var(--muted); font-size: 14px; font-weight: 600; cursor: pointer; }
    .phone-tab-btn.active { color: var(--green); border-bottom: 2px solid var(--green); padding-bottom: 4px; }
    
    .dialer-display {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 10px;
    }
    #dial-input {
      font-size: 34px;
      font-weight: 700;
      color: #fff;
      min-height: 48px;
      letter-spacing: 1px;
      max-width: 90%;
      overflow-x: auto;
      white-space: nowrap;
    }
    
    .dialpad-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      width: 100%;
      max-width: 290px;
      margin: 0 auto 16px auto;
    }
    .dial-key {
      height: 62px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .dial-key:active { background: rgba(255, 255, 255, 0.25); transform: scale(0.92); }
    .dial-key b { font-size: 22px; color: #fff; line-height: 1; }
    .dial-key span { font-size: 10px; color: var(--muted); letter-spacing: 1px; margin-top: 2px; }

    .dial-actions {
      display: flex;
      justify-content: space-around;
      align-items: center;
      max-width: 290px;
      width: 100%;
      margin: 0 auto 24px auto;
    }
    .call-trigger-btn {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: var(--green);
      border: none;
      font-size: 26px;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(34, 197, 94, 0.4);
    }
    .call-del-btn {
      width: 48px;
      height: 48px;
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 20px;
      cursor: pointer;
    }

    /* ACTIVE ONGOING CALL OVERLAY */
    #active-call-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 10%, #1e293b 0%, #030712 100%);
      z-index: 60000;
      display: none;
      flex-direction: column;
      justify-content: space-between;
      padding: 60px 24px 40px 24px;
      text-align: center;
    }
    .caller-avatar {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      border: 2px solid var(--accent);
      margin: 0 auto 16px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
    }
    .call-name { font-size: 24px; font-weight: 700; color: #fff; }
    .call-timer { font-size: 15px; color: var(--green); margin-top: 6px; }

    .call-tools {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      max-width: 280px;
      margin: 0 auto;
    }
    .tool-btn {
      height: 60px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #fff;
      font-size: 20px;
      cursor: pointer;
    }
    .tool-btn.active { background: #fff; color: #000; }
    .end-call-btn {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: var(--red);
      border: none;
      color: #fff;
      font-size: 30px;
      margin: 20px auto 0 auto;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(239, 68, 68, 0.5);
    }
  </style>
</head>
<body>

  <!-- 1. Lock Screen -->
  <section id="lock-screen" onclick="unlockDeviceNow()">
    <div class="lock-content">
      <div class="lock-top-info">
        <span id="lock-status-time">--:--</span>
        <span>5G 📶 100% 🔋</span>
      </div>
      <div class="lock-center-widget">
        <p id="lock-date-display">--</p>
        <h1 id="lock-big-clock">--:--</h1>
        <p class="swipe-hint">Tap anywhere to unlock</p>
      </div>
      <div class="lock-bottom-shortcuts">
        <div class="lock-round-btn" onclick="event.stopPropagation(); alert('AI Assistant Ready');">✨</div>
        <div class="lock-round-btn" onclick="event.stopPropagation(); unlockDeviceNow(); openApp('camera');">📷</div>
      </div>
    </div>
  </section>

  <!-- 2. Status Bar -->
  <header class="status-bar">
    <span id="top-time">--:--</span>
    <div class="status-icons">
      <span>5G</span>
      <span>📶</span>
      <span>100% 🔋</span>
    </div>
  </header>

  <!-- 3. Home Screen -->
  <main class="home-screen">
    <section class="widget-container">
      <div class="clock-card">
        <h1 id="main-clock">--:--</h1>
        <p id="main-date">--</p>
      </div>
      <div class="weather-chip" onclick="openApp('weather')">
        <span class="weather-icon">⛅</span>
        <div><b>29°C</b><small>AQI 42 • Clear</small></div>
      </div>
    </section>

    <section class="grid-nexus">
      <button class="app-btn" onclick="openPhoneApp()"><div class="icon-box mat-green">📞</div><span class="label">Phone</span></button>
      <button class="app-btn" onclick="openApp('photos')"><div class="icon-box mat-purple">🖼️</div><span class="label">Photos</span></button>
      <button class="app-btn" onclick="openApp('calc')"><div class="icon-box mat-blue">🔢</div><span class="label">Calculator</span></button>
      <button class="app-btn" onclick="openApp('notes')"><div class="icon-box mat-yellow">📝</div><span class="label">Notes</span></button>
      <button class="app-btn" onclick="openApp('weather')"><div class="icon-box mat-sky">☀️</div><span class="label">Weather</span></button>
      <button class="app-btn" onclick="openApp('music')"><div class="icon-box mat-pink">🎵</div><span class="label">Music</span></button>
      <button class="app-btn" onclick="openApp('recorder')"><div class="icon-box mat-red">🎙️</div><span class="label">Recorder</span></button>
      <button class="app-btn" onclick="openApp('settings')"><div class="icon-box mat-zinc">⚙️</div><span class="label">Settings</span></button>
    </section>
  </main>

  <!-- 4. Dock -->
  <nav class="dock">
    <button class="app-btn" onclick="openPhoneApp()"><div class="icon-box mat-green">📞</div></button>
    <button class="app-btn" onclick="openApp('browser')"><div class="icon-box mat-sky">🌐</div></button>
    <button class="app-btn" onclick="openApp('camera')"><div class="icon-box mat-slate">📷</div></button>
    <button class="app-btn" onclick="openApp('settings')"><div class="icon-box mat-zinc">⚙️</div></button>
  </nav>

  <!-- 5. Navigation Bar -->
  <footer class="nav-bar">
    <div class="nav-btn" onclick="openApp('settings')">⏹</div>
    <div class="nav-btn" onclick="closeAllModals()">⚪</div>
    <div class="nav-btn" onclick="closeAllModals()">◀</div>
  </footer>

  <!-- ================= PHONE / CALLING APP ================= -->
  <div id="phone-app-window">
    <div class="phone-tabs">
      <button class="phone-tab-btn active" id="tab-dialer-btn" onclick="switchPhoneTab('keypad')">Keypad</button>
      <button class="phone-tab-btn" id="tab-recents-btn" onclick="switchPhoneTab('recents')">Recents</button>
      <button onclick="closePhoneApp()" style="background:none; border:none; color:var(--accent); font-size:13px; font-weight:600; padding-right:12px;">Close ✕</button>
    </div>

    <!-- Tab 1: Keypad Dialpad -->
    <div id="phone-keypad-view" style="flex:1; display:flex; flex-direction:column;">
      <div class="dialer-display">
        <div id="dial-input"></div>
      </div>

      <div class="dialpad-grid">
        <div class="dial-key" onclick="pressKey('1')"><b>1</b><span></span></div>
        <div class="dial-key" onclick="pressKey('2')"><b>2</b><span>ABC</span></div>
        <div class="dial-key" onclick="pressKey('3')"><b>3</b><span>DEF</span></div>
        <div class="dial-key" onclick="pressKey('4')"><b>4</b><span>GHI</span></div>
        <div class="dial-key" onclick="pressKey('5')"><b>5</b><span>JKL</span></div>
        <div class="dial-key" onclick="pressKey('6')"><b>6</b><span>MNO</span></div>
        <div class="dial-key" onclick="pressKey('7')"><b>7</b><span>PQRS</span></div>
        <div class="dial-key" onclick="pressKey('8')"><b>8</b><span>TUV</span></div>
        <div class="dial-key" onclick="pressKey('9')"><b>9</b><span>WXYZ</span></div>
        <div class="dial-key" onclick="pressKey('*')"><b>*</b></div>
        <div class="dial-key" onclick="pressKey('0')"><b>0</b><span>+</span></div>
        <div class="dial-key" onclick="pressKey('#')"><b>#</b></div>
      </div>

      <div class="dial-actions">
        <div style="width:48px;"></div>
        <button class="call-trigger-btn" onclick="startCall(currentDialedNumber || 'Customer Care')">📞</button>
        <button class="call-del-btn" onclick="deleteKey()">⌫</button>
      </div>
    </div>

    <!-- Tab 2: Recents Call Log -->
    <div id="phone-recents-view" style="flex:1; display:none; padding:16px; overflow-y:auto;">
      <h3 style="font-size:15px; color:var(--muted); margin-bottom:12px;">Recent Calls</h3>
      <div id="recents-list" style="display:flex; flex-direction:column; gap:8px;"></div>
    </div>
  </div>

  <!-- ================= ACTIVE ONGOING CALL SCREEN ================= -->
  <div id="active-call-overlay">
    <div>
      <div class="caller-avatar">👤</div>
      <h2 id="live-caller-name" class="call-name">User</h2>
      <p id="live-call-status" class="call-timer">Calling...</p>
    </div>

    <div>
      <div class="call-tools">
        <button class="tool-btn" id="mute-btn" onclick="toggleMute()">🎙️</button>
        <button class="tool-btn" id="speaker-btn" onclick="toggleSpeaker()">🔊</button>
        <button class="tool-btn" onclick="alert('Keypad in call ready')">⌨️</button>
      </div>
      <button class="end-call-btn" onclick="endOngoingCall()">📞</button>
    </div>
  </div>

  <!-- App Window Modal for Generic Apps -->
  <section id="app-modal">
    <div class="modal-hdr">
      <button class="back-btn" onclick="closeApp()">‹ Back</button>
      <h3 id="modal-title">APP</h3>
      <div style="width:40px;"></div>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </section>

  <script>
    // Live Clock Engine
    function syncTimeNow() {
      const d = new Date();
      const h = String(d.getHours()).padStart(2, '0');
      const m = String(d.getMinutes()).padStart(2, '0');
      const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      const timeStr = `${h}:${m}`;
      const dateStr = `${days[d.getDay()]}, ${d.getDate()} ${months[d.getMonth()]}`;

      const elTop = document.getElementById('top-time');
      const elClock = document.getElementById('main-clock');
      const elDate = document.getElementById('main-date');
      const elLockClock = document.getElementById('lock-big-clock');
      const elLockDate = document.getElementById('lock-date-display');
      const elLockTop = document.getElementById('lock-status-time');

      if (elTop) elTop.innerText = timeStr;
      if (elClock) elClock.innerText = timeStr;
      if (elDate) elDate.innerText = dateStr;
      if (elLockClock) elLockClock.innerText = timeStr;
      if (elLockDate) elLockDate.innerText = dateStr;
      if (elLockTop) elLockTop.innerText = timeStr;
    }
    syncTimeNow();
    setInterval(syncTimeNow, 1000);

    // Audio Tone Synthesizer for Real Dial Sounds
    let audioCtx = null;
    function playBeep(freq = 440) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = freq;
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.15);
      } catch (e) {}
    }

    // Unlock
    function unlockDeviceNow() {
      const ls = document.getElementById('lock-screen');
      if (ls) {
        ls.style.transform = 'translateY(-100%)';
        ls.style.opacity = '0';
        setTimeout(() => ls.style.display = 'none', 350);
      }
    }

    function closeAllModals() {
      closeApp();
      closePhoneApp();
    }

    // Phone App Engine
    let currentDialedNumber = '';
    const tones = { '1': 697, '2': 770, '3': 852, '4': 697, '5': 770, '6': 852, '7': 941, '8': 770, '9': 852, '0': 941, '*': 697, '#': 941 };

    function openPhoneApp() {
      closeApp();
      document.getEl
