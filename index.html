<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Nexus OS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Startup Splash -->
  <div id="hello-splash">
    <div>
      <h1 class="hello-text">Hello</h1>
      <p class="hello-sub">Nexus OS 2.5</p>
    </div>
  </div>

  <!-- Real Smartphone Lock Screen -->
  <section id="lock-screen">
    <!-- View 1: Big Clock Wallpaper View -->
    <div id="lock-clock-view" onclick="handleLockSwipe()">
      <div class="lock-top-info">
        <span id="lock-status-time">--:--</span>
        <span>5G 📶 100% 🔋</span>
      </div>
      
      <div class="lock-center-widget">
        <p id="lock-date-display">Sun, 16 Aug</p>
        <h1 id="lock-big-clock">18:53</h1>
        <p class="swipe-hint">Swipe up or Tap to unlock</p>
      </div>

      <div class="lock-bottom-shortcuts">
        <div class="lock-round-btn" onclick="event.stopPropagation(); alert('AI Assistant Ready');">✨</div>
        <div class="lock-round-btn" onclick="event.stopPropagation(); directUnlock(); openApp('camera');">📷</div>
      </div>
    </div>

    <!-- View 2: PIN Security Keypad -->
    <div id="lock-pin-view">
      <div class="pin-header">
        <div class="lock-padlock">🔒</div>
        <h3>Enter PIN</h3>
        <p id="pin-sub-text">Enter your 4-digit code</p>
      </div>

      <div class="pin-dots-wrap" id="pin-dots">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
      </div>

      <div class="pin-keypad">
        <button class="p-key" onclick="typePin('1')">1</button>
        <button class="p-key" onclick="typePin('2')">2</button>
        <button class="p-key" onclick="typePin('3')">3</button>
        <button class="p-key" onclick="typePin('4')">4</button>
        <button class="p-key" onclick="typePin('5')">5</button>
        <button class="p-key" onclick="typePin('6')">6</button>
        <button class="p-key" onclick="typePin('7')">7</button>
        <button class="p-key" onclick="typePin('8')">8</button>
        <button class="p-key" onclick="typePin('9')">9</button>
        <button class="p-key cancel" onclick="backToClockView()">Cancel</button>
        <button class="p-key" onclick="typePin('0')">0</button>
        <button class="p-key" onclick="deletePin()">⌫</button>
      </div>
    </div>
  </section>

  <!-- Top Status Bar -->
  <header class="status-bar">
    <span id="top-time">--:--</span>
    <div class="status-icons">
      <span>5G</span>
      <span>📶</span>
      <span>100% 🔋</span>
    </div>
  </header>

  <!-- Home Screen -->
  <main class="home-screen">
    <section class="widget-container">
      <div class="clock-card">
        <h1 id="main-clock">--:--</h1>
        <p id="main-date">--</p>
      </div>
      <div class="weather-chip" onclick="openApp('weather')">
        <span class="weather-icon">⛅</span>
        <div>
          <b>29°C</b>
          <small>AQI 42 • Clear</small>
        </div>
      </div>
    </section>

    <!-- 8 Apps Grid -->
    <section class="grid">
      <button class="app-btn" onclick="openApp('photos')"><div class="icon-box mat-purple">🖼️</div><span class="label">Photos</span></button>
      <button class="app-btn" onclick="openApp('calc')"><div class="icon-box mat-blue">🔢</div><span class="label">Calculator</span></button>
      <button class="app-btn" onclick="openApp('notes')"><div class="icon-box mat-yellow">📝</div><span class="label">Notes</span></button>
      <button class="app-btn" onclick="openApp('weather')"><div class="icon-box mat-sky">☀️</div><span class="label">Weather</span></button>
      <button class="app-btn" onclick="openApp('music')"><div class="icon-box mat-pink">🎵</div><span class="label">Music</span></button>
      <button class="app-btn" onclick="openApp('recorder')"><div class="icon-box mat-red">🎙️</div><span class="label">Recorder</span></button>
      <button class="app-btn" onclick="openApp('files')"><div class="icon-box mat-amber">📁</div><span class="label">Files</span></button>
      <button class="app-btn" onclick="openApp('drivers')"><div class="icon-box mat-cyan">🎛️</div><span class="label">Hardware</span></button>
    </section>
  </main>

  <!-- Bottom Dock -->
  <nav class="dock">
    <button class="app-btn" onclick="openApp('dialer')"><div class="icon-box mat-green">📞</div></button>
    <button class="app-btn" onclick="openApp('browser')"><div class="icon-box mat-sky">🌐</div></button>
    <button class="app-btn" onclick="openApp('camera')"><div class="icon-box mat-slate">📷</div></button>
    <button class="app-btn" onclick="openApp('settings')"><div class="icon-box mat-zinc">⚙️</div></button>
  </nav>

  <!-- Navigation Bar -->
  <footer class="nav-bar">
    <div class="nav-btn" onclick="openApp('drivers')">⏹</div>
    <div class="nav-btn" onclick="closeApp()">⚪</div>
    <div class="nav-btn" onclick="closeApp()">◀</div>
  </footer>

  <!-- App Window Modal -->
  <section id="app-modal">
    <div class="modal-hdr" id="modal-hdr">
      <button class="back-btn" onclick="closeApp()">‹ Back</button>
      <h3 id="modal-title">SETTINGS</h3>
      <div style="width: 40px;"></div>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </section>

  <!-- Power Menu Overlay -->
  <div id="power-overlay">
    <div class="power-card">
      <h3 style="font-size:18px; margin-bottom:4px;">Power Options</h3>
      <button class="p-btn p-restart" onclick="restartDevice()">🔄 Restart</button>
      <button class="p-btn p-off" onclick="powerOffDevice()">⚡ Power Off</button>
      <button class="p-btn p-cancel" onclick="hidePowerMenu()">Cancel</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
