<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Nexus OS</title>
  <style>
    :root {
      --bg: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #090d16 60%, #030712 100%);
      --glass: rgba(255, 255, 255, 0.08);
      --border: rgba(255, 255, 255, 0.12);
      --accent: #38bdf8;
      --yellow: #f59e0b;
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg);
      background-size: cover;
      background-position: center;
      color: var(--text);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: env(safe-area-inset-top, 12px) 16px 0 16px;
    }

    /* Lock Screen */
    #lock-screen {
      position: fixed;
      inset: 0;
      background: inherit;
      background-size: cover;
      background-position: center;
      z-index: 50000;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px 20px 24px 20px;
      cursor: pointer;
      transition: transform 0.35s ease, opacity 0.3s ease;
    }
    #lock-screen::before {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.3);
      z-index: 1;
    }
    .lock-content {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .lock-top-info { display: flex; justify-content: space-between; font-size: 13px; color: #fff; font-weight: 600; }
    .lock-center-widget { text-align: center; margin-top: 40px; }
    #lock-date-display { font-size: 16px; font-weight: 600; color: #fff; margin-bottom: 4px; }
    #lock-big-clock { font-size: 82px; font-weight: 800; line-height: 1; color: #fff; letter-spacing: -2px; text-shadow: 0 4px 20px rgba(0, 0, 0, 0.6); }
    .swipe-hint { font-size: 13px; color: rgba(255, 255, 255, 0.85); margin-top: 14px; }
    .lock-bottom-shortcuts { display: flex; justify-content: space-between; align-items: center; padding: 0 10px; }
    .lock-round-btn {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      cursor: pointer;
    }

    /* Top Status Bar */
    .status-bar { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); font-weight: 600; }
    .status-icons { display: flex; align-items: center; gap: 6px; font-size: 12px; }

    /* Home Screen */
    .home-screen { flex: 1; display: flex; flex-direction: column; gap: 16px; margin-top: 10px; }
    .widget-container { display: flex; gap: 12px; }
    .clock-card {
      flex: 2;
      background: var(--glass);
      border: 1px solid var(--border);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-radius: 26px;
      padding: 18px 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }
    .clock-card h1 { font-size: 40px; line-height: 1; font-weight: 700; }
    .clock-card p { font-size: 13px; color: var(--muted); margin-top: 6px; }

    .weather-chip {
      flex: 1;
      background: var(--glass);
      border: 1px solid var(--border);
      backdrop-filter: blur(25px);
      border-radius: 26px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
    }
    .weather-icon { font-size: 24px; }
    .weather-chip b { font-size: 16px; display: block; }
    .weather-chip small { color: #22c55e; font-weight: 600; font-size: 11px; }

    /* Grid */
    .grid-nexus { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px 10px; }
    .app-btn { background: transparent; border: none; display: flex; flex-direction: column; align-items: center; cursor: pointer; }
    .app-btn:active .icon-box { transform: scale(0.88); }
    .icon-box {
      width: 58px;
      height: 58px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: none;
    }
    .label { font-size: 12px; color: var(--text); margin-top: 6px; text-align: center; font-weight: 500; pointer-events: none; }

    /* Color styles */
    .mat-green-wa { background: linear-gradient(135deg, #25d366, #128c7e); }
    .mat-purple { background: linear-gradient(135deg, #a855f7, #6b21a8); }
    .mat-blue { background: linear-gradient(135deg, #0284c7, #0369a1); }
    .mat-yellow { background: linear-gradient(135deg, #f59e0b, #d97706); }
    .mat-sky { background: linear-gradient(135deg, #38bdf8, #0284c7); }
    .mat-pink { background: linear-gradient(135deg, #ec4899, #be185d); }
    .mat-red { background: linear-gradient(135deg, #ef4444, #b91c1c); }
    .mat-amber { background: linear-gradient(135deg, #f59e0b, #b45309); }
    .mat-zinc { background: linear-gradient(135deg, #64748b, #334155); }
    .mat-slate { background: linear-gradient(135deg, #475569, #1e293b); }

    /* Dock */
    .dock {
      background: var(--glass);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid var(--border);
      border-radius: 28px;
      height: 72px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin-bottom: 8px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.5);
    }
    .nav-bar { height: 42px; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid rgba(255, 255, 255, 0.05); }
    .nav-btn { font-size: 16px; color: var(--muted); padding: 8px 30px; cursor: pointer; }
    .nav-btn:active { color: #fff; transform: scale(0.85); }

    /* Modal System */
    #app-modal {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      background: #030712;
      z-index: 2000;
      display: none;
      flex-direction: column;
      padding: env(safe-area-inset-top, 12px) 16px env(safe-area-inset-bottom, 12px) 16px;
    }
    .modal-hdr { padding: 12px 6px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); }
    .back-btn { background: transparent; border: none; color: var(--accent); font-size: 16px; font-weight: 600; cursor: pointer; }
    .modal-body { flex: 1; overflow-y: auto; padding: 16px 4px; position: relative; }

    .card { background: var(--glass); border: 1px solid var(--border); border-radius: 20px; padding: 16px; margin-bottom: 12px; backdrop-filter: blur(20px); }
    .card-item { display: flex; justify-content: space-between; align-items: center; padding: 13px 0; border-bottom: 1px solid rgba(255,255,255,0.06); cursor: pointer; }
    .card-item:last-child { border-bottom: none; }

    /* Calculator */
    .calc-screen { background: rgba(255, 255, 255, 0.04); padding: 24px 16px; border-radius: 20px; font-size: 38px; text-align: right; margin-bottom: 16px; min-height: 80px; }
    .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .calc-btn { padding: 16px 0; border-radius: 16px; border: none; background: #1e293b; color: #fff; font-size: 20px; font-weight: 600; cursor: pointer; }
    .calc-btn.op { background: var(--yellow); color: #000; }
    .calc-btn.action { background: #334155; }

    /* Power Overlay */
    #power-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(25px); z-index: 10000; display: none; justify-content: center; align-items: center; }
    .power-card { width: 85%; max-width: 320px; background: #0f172a; border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 26px; padding: 24px; text-align: center; display: flex; flex-direction: column; gap: 12px; }
    .p-btn { width: 100%; padding: 14px; border-radius: 16px; border: none; font-size: 15px; font-weight: 600; cursor: pointer; }
    .p-restart { background: #38bdf8; color: #000; }
    .p-off { background: #ef4444; color: #fff; }
    .p-cancel { background: #334155; color: #fff; }

    /* WhatsApp Clean Vanilla Layout */
    #whatsapp-app-window {
      position: fixed;
      inset: 0;
      background: #0b141a;
      z-index: 3000;
      display: none;
      flex-direction: column;
    }
    .wa-nav-bar { display: flex; justify-content: space-around; background: #1f2c34; padding: 12px 0; border-top: 1px solid #2a3942; }
    .wa-nav-item { background: transparent; border: none; color: #8696a0; font-size: 13px; font-weight: 600; cursor: pointer; }
    .wa-nav-item.active { color: #25d366; }
    .wa-chat-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.05); cursor: pointer; }
  </style>
</head>
<body>

  <!-- Instant Responsive Lock Screen -->
  <section id="lock-screen" onclick="unlockDeviceNow()">
    <div class="lock-content">
      <div class="lock-top-info">
        <span id="lock-status-time">--:--</span>
        <span>5G 📶 100% 🔋</span>
      </div>
      
      <div class="lock-center-widget">
        <p id="lock-date-display">--</p>
        <h1 id="lock-big-clock">--:--</h1>
        <p class="swipe-hint">Tap anywhere to unlock</p>
      </div>

      <div class="lock-bottom-shortcuts">
        <div class="lock-round-btn" onclick="event.stopPropagation(); alert('Nexus AI Ready');">✨</div>
        <div class="lock-round-btn" onclick="event.stopPropagation(); unlockDeviceNow(); openApp('camera');">📷</div>
      </div>
    </div>
  </section>

  <!-- Top Status Bar -->
  <header class="status-bar">
    <span id="top-time">--:--</span>
    <div class="status-icons">
      <span>5G</span>
      <span>📶</span>
      <span>100% 🔋</span>
    </div>
  </header>

  <!-- Home Screen -->
  <main class="home-screen">
    <section class="widget-container">
      <div class="clock-card">
        <h1 id="main-clock">--:--</h1>
        <p id="main-date">--</p>
      </div>
      <div class="weather-chip" onclick="openApp('weather')">
        <span class="weather-icon">⛅</span>
        <div>
          <b>29°C</b>
          <small>AQI 42 • Clear</small>
        </div>
      </div>
    </section>

    <!-- App Grid -->
    <section class="grid-nexus">
      <button class="app-btn" onclick="openWhatsApp()"><div class="icon-box mat-green-wa">💬</div><span class="label">WhatsApp</span></button>
      <button class="app-btn" onclick="openApp('photos')"><div class="icon-box mat-purple">🖼️</div><span class="label">Photos</span></button>
      <button class="app-btn" onclick="openApp('calc')"><div class="icon-box mat-blue">🔢</div><span class="label">Calculator</span></button>
      <button class="app-btn" onclick="openApp('notes')"><div class="icon-box mat-yellow">📝</div><span class="label">Notes</span></button>
      <button class="app-btn" onclick="openApp('weather')"><div class="icon-box mat-sky">☀️</div><span class="label">Weather</span></button>
      <button class="app-btn" onclick="openApp('music')"><div class="icon-box mat-pink">🎵</div><span class="label">Music</span></button>
      <button class="app-btn" onclick="openApp('recorder')"><div class="icon-box mat-red">🎙️</div><span class="label">Recorder</span></button>
      <button class="app-btn" onclick="openApp('files')"><div class="icon-box mat-amber">📁</div><span class="label">Files</span></button>
    </section>
  </main>

  <!-- Bottom Dock -->
  <nav class="dock">
    <button class="app-btn" onclick="openWhatsApp()"><div class="icon-box mat-green-wa">📞</div></button>
    <button class="app-btn" onclick="openApp('browser')"><div class="icon-box mat-sky">🌐</div></button>
    <button class="app-btn" onclick="openApp('camera')"><div class="icon-box mat-slate">📷</div></button>
    <button class="app-btn" onclick="openApp('settings')"><div class="icon-box mat-zinc">⚙️</div></button>
  </nav>

  <!-- Nav Bar -->
  <footer class="nav-bar">
    <div class="nav-btn" onclick="openApp('settings')">⏹</div>
    <div class="nav-btn" onclick="closeAllModals()">⚪</div>
    <div class="nav-btn" onclick="closeAllModals()">◀</div>
  </footer>

  <!-- App Window Modal -->
  <section id="app-modal">
    <div class="modal-hdr" id="modal-hdr">
      <button class="back-btn" onclick="closeApp()">‹ Back</button>
      <h3 id="modal-title">APP</h3>
      <div style="width: 40px;"></div>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </section>

  <!-- WhatsApp Window -->
  <div id="whatsapp-app-window">
    <div style="background:#1f2c34; padding:14px 16px; display:flex; justify-content:space-between; align-items:center;">
      <h2 style="font-size:18px; font-weight:bold; color:#fff;">WhatsApp</h2>
      <button onclick="closeWhatsApp()" style="background:transparent; border:none; color:#38bdf8; font-size:14px; font-weight:600;">‹ Nexus Home</button>
    </div>

    <div style="flex:1; overflow-y:auto;">
      <div class="wa-chat-item" onclick="openChatRoom('CR Electronics', '⚡')">
        <div style="width:48px; height:48px; border-radius:50%; background:#2a3942; display:flex; align-items:center; justify-content:center; font-size:20px;">⚡</div>
        <div style="flex:1;">
          <div style="display:flex; justify-content:space-between;"><b>CR Electronics</b><span style="font-size:11px; color:#8696a0;">16:29</span></div>
          <p style="font-size:12px; color:#8696a0; margin-top:2px;">defence buddy added +91...</p>
        </div>
      </div>
      <div class="wa-chat-item" onclick="openChatRoom('Electronics Group', '🎓')">
        <div style="width:48px; height:48px; border-radius:50%; background:#2a3942; display:flex; align-items:center; justify-content:center; font-size:20px;">🎓</div>
        <div style="flex:1;">
          <div style="display:flex; justify-content:space-between;"><b>Electronics Group</b><span style="font-size:11px; color:#8696a0;">12:51</span></div>
          <p style="font-size:12px; color:#8696a0; margin-top:2px;">Check urgent update...</p>
        </div>
      </div>
    </div>

    <!-- Active Chat Screen -->
    <div id="wa-chat-room" style="display:none; position:fixed; inset:0; background:#0b141a; z-index:3500; flex-direction:column;">
      <div style="background:#1f2c34; padding:12px 16px; display:flex; justify-content:space-between; align-items:center;">
        <div style="display:flex; align-items:center; gap:10px;">
          <button onclick="document.getElementById('wa-chat-room').style.display='none'" style="background:none; border:none; color:#fff; font-size:18px;">‹</button>
          <b id="wa-active-name" style="color:#fff;">Room</b>
        </div>
        <button onclick="alert('Voice calling...')" style="background:none; border:none; font-size:18px;">📞</button>
      </div>
      <div id="wa-msg-pane" style="flex:1; padding:16px; overflow-y:auto; display:flex; flex-direction:column; gap:8px;"></div>
      <div style="padding:10px; background:#1f2c34; display:flex; gap:8px;">
        <input id="wa-text-input" type="text" placeholder="Type a message..." style="flex:1; background:#2a3942; border:none; border-radius:20px; padding:10px 16px; color:#fff; outline:none;">
        <button onclick="sendWaMsg()" style="background:#00a884; border:none; border-radius:50%; width:42px; height:42px; color:#fff;">➤</button>
      </div>
    </div>

    <div class="wa-nav-bar">
      <button class="wa-nav-item active">Chats</button>
      <button class="wa-nav-item" onclick="alert('Status list updated')">Updates</button>
      <button class="wa-nav-item" onclick="alert('Communities ready')">Communities</button>
      <button class="wa-nav-item" onclick="alert('Calling history')">Calls</button>
    </div>
  </div>

  <!-- Power Menu Overlay -->
  <div id="power-overlay">
    <div class="power-card">
      <h3 style="font-size:18px; margin-bottom:4px;">Power Options</h3>
      <button class="p-btn p-restart" onclick="restartDevice()">🔄 Restart</button>
      <button class="p-btn p-off" onclick="powerOffDevice()">⚡ Power Off</button>
      <button class="p-btn p-cancel" onclick="hidePowerMenu()">Cancel</button>
    </div>
  </div>

  <script>
    // 1. Direct Time Engine (Guaranteed Execution)
    function syncTimeNow() {
      const d = new Date();
      const h = String(d.getHours()).padStart(2, '0');
      const m = String(d.getMinutes()).padStart(2, '0');
      const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
      const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      const timeStr = h + ':' + m;
      const dateStr = days[d.getDay()] + ', ' + d.getDate() + ' ' + months[d.getMonth()];

      const elTop = document.getElementById('top-time');
      const elClock = document.getElementById('main-clock');
      const elDate = document.getElementById('main-date');
      const elLockClock = document.getElementById('lock-big-clock');
      const elLockDate = document.getElementById('lock-date-display');
      const elLockTop = document.getElementById('lock-status-time');

      if (elTop) elTop.innerText = timeStr;
      if (elClock) elClock.innerText = timeStr;
      if (elDate) elDate.innerText = dateStr;
      if (elLockClock) elLockClock.innerText = timeStr;
      if (elLockDate) elLockDate.innerText = dateStr;
      if (elLockTop) elLockTop.innerText = timeStr;
    }
    syncTimeNow();
    setInterval(syncTimeNow, 1000);

    let calcBuffer = '';
    let mediaStream = null;

    // Load Wallpaper
    const savedWp = localStorage.getItem('nexus_wallpaper');
    if (savedWp) {
      document.body.style.backgroundImage = 'url(' + savedWp + ')';
      const ls = document.getElementById('lock-screen');
      if (ls) ls.style.backgroundImage = 'url(' + savedWp + ')';
    }

    // Direct Instant Unlock
    function unlockDeviceNow() {
      const ls = document.getElementById('lock-screen');
      if (ls) {
        ls.style.transform = 'translateY(-100%)';
        ls.style.opacity = '0';
        setTimeout(function() { ls.style.display = 'none'; }, 350);
      }
    }

    function lockDeviceNow() {
      const ls = document.getElementById('lock-screen');
      if (ls) {
        ls.style.display = 'flex';
        setTimeout(function() {
          ls.style.transform = 'translateY(0)';
          ls.style.opacity = '1';
        }, 10);
      }
      closeAllModals();
    }

    // Modal Manager
    function closeAllModals() {
      closeApp();
      closeWhatsApp();
    }

    function openWhatsApp() {
      closeApp();
      document.getElementById('whatsapp-app-window').style.display = 'flex';
    }

    function closeWhatsApp() {
      document.getElementById('whatsapp-app-window').style.display = 'none';
    }

    let activeChatTitle = '';
    function openChatRoom(title, icon) {
      activeChatTitle = title;
      document.getElementById('wa-active-name').innerText = title;
      document.getElementById('wa-chat-room').style.display = 'flex';
      renderWaMessages();
    }

    function sendWaMsg() {
      const inp = document.getElementById('wa-text-input');
      const txt = inp.value.trim();
      if (!txt) return;

      const msgs = JSON.parse(localStorage.getItem('wa_msgs_' + activeChatTitle) || '[]');
      msgs.push({ text: txt, time: new Date().toL
