<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <!-- Standalone Web App Meta Tags -->
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#070a12">
  
  <title>Nexus OS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body onclick="launchFullScreen()">

  <!-- Boot Screen -->
  <div id="boot-screen">
    <svg class="hello-svg" viewBox="0 0 300 120">
      <text x="50%" y="65%" text-anchor="middle" dominant-baseline="middle" class="hello-text">hello</text>
    </svg>
  </div>

  <!-- Main OS Screen -->
  <main id="main-os">
    <header class="status-bar">
      <span id="live-status-time">--:--</span>
      <span>VoLTE 5G • 100%</span>
    </header>

    <section class="time-card">
      <div>
        <h1 id="live-clock">--:--</h1>
        <p id="live-date">--</p>
      </div>
      <span class="os-badge">⚡ NEXUS OS</span>
    </section>

    <input type="text" id="app-search" class="search-box" placeholder="Search system, apps, tools..." oninput="filterApps()">

    <section class="grid" id="home-grid">
      <div class="app-item" onclick="openApp('dialer')">
        <div class="icon bg-green">📞</div>
        <span class="label">Phone</span>
      </div>
      <div class="app-item" onclick="openApp('camera')">
        <div class="icon bg-slate">📷</div>
        <span class="label">Camera</span>
      </div>
      <div class="app-item" onclick="openApp('photos')">
        <div class="icon bg-purple">🖼️</div>
        <span class="label">Photos</span>
      </div>
      <div class="app-item" onclick="openApp('calc')">
        <div class="icon bg-blue">🔢</div>
        <span class="label">Calculator</span>
      </div>
      <div class="app-item" onclick="openApp('notes')">
        <div class="icon bg-yellow">📝</div>
        <span class="label">Notes</span>
      </div>
      <div class="app-item" onclick="openApp('weather')">
        <div class="icon bg-sky">☀️</div>
        <span class="label">Weather</span>
      </div>
      <div class="app-item" onclick="openApp('watch')">
        <div class="icon bg-rose">⏱️</div>
        <span class="label">Watch</span>
      </div>
      <div class="app-item" onclick="openApp('settings')">
        <div class="icon bg-zinc">⚙️</div>
        <span class="label">Settings</span>
      </div>
    </section>
  </main>

  <!-- App Window Modal -->
  <section id="app-window">
    <div class="window-header">
      <button class="back-btn" onclick="closeApp()">‹ Back</button>
      <h3 id="window-title">App</h3>
      <div style="width: 50px;"></div>
    </div>
    <div class="window-content" id="window-content"></div>
  </section>

  <script src="script.js"></script>
</body>
</html>
