<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Nexus OS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Main Swipeable OS Container -->
  <div id="os-container">
    <!-- Page 1: Main System Apps -->
    <section class="page">
      <header class="status-bar">
        <span id="live-status-time">--:--</span>
        <span>VoLTE 5G • 100%</span>
      </header>

      <section class="time-card">
        <div>
          <h1 id="live-clock">--:--</h1>
          <p id="live-date">--</p>
        </div>
        <span class="os-badge">⚡ NEXUS</span>
      </section>

      <input type="text" id="app-search" class="search-box" placeholder="Search system, apps, drivers..." oninput="filterApps()">

      <div class="grid" id="home-grid">
        <div class="app-item" onclick="openApp('photos')"><div class="icon bg-purple">🖼️</div><span class="label">Photos</span></div>
        <div class="app-item" onclick="openApp('calc')"><div class="icon bg-blue">🔢</div><span class="label">Calculator</span></div>
        <div class="app-item" onclick="openApp('notes')"><div class="icon bg-yellow">📝</div><span class="label">Notes</span></div>
        <div class="app-item" onclick="openApp('weather')"><div class="icon bg-sky">☀️</div><span class="label">Weather</span></div>
        <div class="app-item" onclick="openApp('music')"><div class="icon bg-pink">🎵</div><span class="label">Music</span></div>
        <div class="app-item" onclick="openApp('recorder')"><div class="icon bg-red">🎙️</div><span class="label">Recorder</span></div>
        <div class="app-item" onclick="openApp('files')"><div class="icon bg-amber">📁</div><span class="label">Files</span></div>
        <div class="app-item" onclick="openApp('drivers')"><div class="icon bg-cyan">🎛️</div><span class="label">Drivers</span></div>
      </div>
    </section>

    <!-- Page 2: Tools, Sensors & Games -->
    <section class="page">
      <header class="status-bar">
        <span>More Tools & Sensors</span>
        <span>Page 2/2</span>
      </header>

      <div class="grid" style="margin-top: 10px;">
        <div class="app-item" onclick="openApp('game')"><div class="icon bg-emerald">🎮</div><span class="label">Games</span></div>
        <div class="app-item" onclick="openApp('paint')"><div class="icon bg-indigo">🎨</div><span class="label">Paint</span></div>
        <div class="app-item" onclick="openApp('compass')"><div class="icon bg-teal">🧭</div><span class="label">Compass</span></div>
        <div class="app-item" onclick="openApp('watch')"><div class="icon bg-rose">⏱️</div><span class="label">Watch</span></div>
        <div class="app-item" onclick="openApp('messages')"><div class="icon bg-blue">💬</div><span class="label">Messages</span></div>
      </div>
    </section>
  </div>

  <!-- Persistent Dock -->
  <nav class="dock" id="main-dock">
    <div class="app-item" onclick="openApp('dialer')"><div class="icon bg-green">📞</div></div>
    <div class="app-item" onclick="openApp('browser')"><div class="icon bg-cyan">🌐</div></div>
    <div class="app-item" onclick="openApp('camera')"><div class="icon bg-slate">📷</div></div>
    <div class="app-item" onclick="openApp('settings')"><div class="icon bg-zinc">⚙️</div></div>
  </nav>

  <!-- Navigation Bar: 3-Buttons Mode -->
  <footer class="nav-bar" id="nav-buttons-bar"></footer>

  <!-- Gesture Navigation Bar Mode -->
  <div class="gesture-bar-wrap" id="nav-gesture-bar" onclick="navHome()">
    <div class="gesture-pill"></div>
  </div>

  <!-- Modal Application Screen -->
  <section id="app-window">
    <div class="window-header" id="win-hdr">
      <button class="back-btn" onclick="closeApp()">‹ Back</button>
      <h3 id="window-title">App</h3>
      <div style="width: 50px;"></div>
    </div>
    <div class="window-content" id="window-content"></div>
  </section>

  <!-- Recents / Multi-Tasking Modal -->
  <section id="recents-modal">
    <div class="recents-header">
      <h3>Active Tasks</h3>
      <button class="clear-task-btn" onclick="clearAllTasks()">Clear All</button>
    </div>
    <div class="task-list" id="task-list"></div>
  </section>

  <script src="script.js"></script>
</body>
</html>
