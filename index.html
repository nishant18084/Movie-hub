<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Nexus OS</title>
  <style>
    :root {
      --bg: #070a12;
      --surface: rgba(255, 255, 255, 0.07);
      --border: rgba(255, 255, 255, 0.12);
      --accent: #38bdf8;
      --yellow: #f59e0b;
      --text: #ffffff;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      outline: none;
    }

    html, body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
    }

    /* Ultra-Smooth Swipe OS Viewport */
    #os-viewport {
      display: flex;
      width: 100vw;
      height: calc(100dvh - 120px);
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-x: contain;
    }
    #os-viewport::-webkit-scrollbar { display: none; }

    .page {
      flex: 0 0 100vw;
      width: 100vw;
      scroll-snap-align: start;
      padding: env(safe-area-inset-top, 14px) 16px 0 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      will-change: transform;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: var(--muted);
      font-weight: 500;
    }

    .time-card {
      background: var(--surface);
      border: 1px solid var(--border);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 22px;
      padding: 16px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }
    .time-card h1 { font-size: 38px; line-height: 1; font-weight: 600; }
    .time-card p { font-size: 13px; color: var(--muted); margin-top: 4px; }
    .os-badge { color: var(--yellow); font-weight: 700; font-size: 13px; letter-spacing: 0.5px; }

    .search-bar {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 11px 14px;
      color: #fff;
      font-size: 14px;
    }
    .search-bar::placeholder { color: #64748b; }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px 10px;
    }

    .app-item {
      background: transparent;
      border: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      touch-action: manipulation;
    }

    .icon {
      width: 56px;
      height: 56px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4);
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: none;
    }
    .app-item:active .icon { transform: scale(0.86); }
    .label { font-size: 11px; color: #cbd5e1; margin-top: 5px; text-align: center; pointer-events: none; }

    /* Colors */
    .bg-green { background: #22c55e; }
    .bg-blue { background: #0284c7; }
    .bg-slate { background: #475569; }
    .bg-yellow { background: #eab308; }
    .bg-sky { background: #38bdf8; }
    .bg-rose { background: #e11d48; }
    .bg-zinc { background: #52525b; }
    .bg-purple { background: #a855f7; }
    .bg-pink { background: #ec4899; }
    .bg-cyan { background: #06b6d4; }
    .bg-red { background: #ef4444; }
    .bg-amber { background: #f59e0b; }
    .bg-indigo { background: #6366f1; }
    .bg-emerald { background: #10b981; }
    .bg-teal { background: #14b8a6; }

    /* Dock */
    .dock {
      position: fixed;
      bottom: 48px;
      left: 16px;
      right: 16px;
      height: 66px;
      background: rgba(255, 255, 255, 0.09);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 50;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    /* Navigation Bar */
    .nav-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 44px;
      background: #000;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }
    .nav-btn {
      font-size: 16px;
      color: #94a3b8;
      padding: 8px 30px;
      cursor: pointer;
      transition: transform 0.1s ease, color 0.1s ease;
    }
    .nav-btn:active { color: #fff; transform: scale(0.85); }

    /* Modal Windows with Smooth Spring Transition */
    #app-modal {
      position: fixed;
      inset: 0;
      bottom: 44px;
      background: #080c16;
      z-index: 200;
      display: flex;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
      transform: translateY(30px) scale(0.97);
      transition: transform 0.22s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.2s ease;
    }
    #app-modal.active {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0) scale(1);
    }

    .modal-hdr {
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }
    .back-btn {
      background: transparent;
      border: none;
      color: var(--accent);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .modal-body { flex: 1; overflow-y: auto; padding: 18px; position: relative; }

    /* Cards */
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 18px; padding: 14px; margin-bottom: 10px; }
    .card-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .card-item:last-child { border-bottom: none; }

    /* Camera Viewfinder */
    .cam-box { position: absolute; inset: 0; background: #000; display: flex; flex-direction: column; justify-content: space-between; overflow: hidden; }
    .cam-feed-area { flex: 1; position: relative; background: #111; overflow: hidden; }
    .cam-feed-area video { width: 100%; height: 100%; object-fit: cover; }
    .cam-controls { display: flex; justify-content: space-around; align-items: center; padding: 20px; background: #000; }
    .shutter { width: 70px; height: 70px; border-radius: 50%; border: 4px solid #fff; background: transparent; padding: 4px; cursor: pointer; }
    .shutter-inner { width: 100%; height: 100%; background: #fff; border-radius: 50%; }

    /* Calculator */
    .calc-screen { background: rgba(255, 255, 255, 0.05); padding: 18px 14px; border-radius: 14px; font-size: 32px; text-align: right; margin-bottom: 14px; min-height: 65px; }
    .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .calc-btn { padding: 14px 0; border-radius: 12px; border: none; background: #1e293b; color: #fff; font-size: 18px; font-weight: 600; cursor: pointer; }
    .calc-btn.op { background: #f59e0b; color: #000; }
  </style>
</head>
<body>

  <!-- OS Container -->
  <div id="os-viewport">
    <!-- Page 1: Main Apps -->
    <section class="page">
      <header class="status-bar">
        <span id="top-time">--:--</span>
        <span>VoLTE 5G • 100%</span>
      </header>

      <section class="time-card">
        <div>
          <h1 id="main-clock">--:--</h1>
          <p id="main-date">--</p>
        </div>
        <span class="os-badge">⚡ NEXUS</span>
      </section>

      <input type="text" id="app-search" class="search-bar" placeholder="Search system, apps, tools..." oninput="filterApps()">

      <div class="grid" id="home-grid">
        <button class="app-item" onclick="openApp('photos')"><div class="icon bg-purple">🖼️</div><span class="label">Photos</span></button>
        <button class="app-item" onclick="openApp('calc')"><div class="icon bg-blue">🔢</div><span class="label">Calculator</span></button>
        <button class="app-item" onclick="openApp('notes')"><div class="icon bg-yellow">📝</div><span class="label">Notes</span></button>
        <button class="app-item" onclick="openApp('weather')"><div class="icon bg-sky">☀️</div><span class="label">Weather</span></button>
        <button class="app-item" onclick="openApp('music')"><div class="icon bg-pink">🎵</div><span class="label">Music</span></button>
        <button class="app-item" onclick="openApp('recorder')"><div class="icon bg-red">🎙️</div><span class="label">Recorder</span></button>
        <button class="app-item" onclick="openApp('files')"><div class="icon bg-amber">📁</div><span class="label">Files</span></button>
        <button class="app-item" onclick="openApp('drivers')"><div class="icon bg-cyan">🎛️</div><span class="label">Drivers</span></button>
      </div>
    </section>

    <!-- Page 2: Extra Tools & Sensors -->
    <section class="page">
      <header class="status-bar">
        <span>Tools & Sensors</span>
        <span>Page 2/2</span>
      </header>

      <div class="grid" style="margin-top: 10px;">
        <button class="app-item" onclick="openApp('game')"><div class="icon bg-emerald">🎮</div><span class="label">Games</span></button>
        <button class="app-item" onclick="openApp('paint')"><div class="icon bg-indigo">🎨</div><span class="label">Paint</span></button>
        <button class="app-item" onclick="openApp('compass')"><div class="icon bg-teal">🧭</div><span class="label">Compass</span></button>
        <button class="app-item" onclick="openApp('watch')"><div class="icon bg-rose">⏱️</div><span class="label">Watch</span></button>
        <button class="app-item" onclick="openApp('messages')"><div class="icon bg-blue">💬</div><span class="label">Messages</span></button>
      </div>
    </section>
  </div>

  <!-- Dock -->
  <nav class="dock">
    <button class="app-item" onclick="openApp('dialer')"><div class="icon bg-green">📞</div></button>
    <button class="app-item" onclick="openApp('browser')"><div class="icon bg-cyan">🌐</div></button>
    <button class="app-item" onclick="openApp('camera')"><div class="icon bg-slate">📷</div></button>
    <button class="app-item" onclick="openApp('settings')"><div class="icon bg-zinc">⚙️</div></button>
  </nav>

  <!-- 3-Button Navigation Bar -->
  <footer class="nav-bar">
    <div class="nav-btn" onclick="alert('Recents: Background apps online')">⏹</div>
    <div class="nav-btn" onclick="closeApp()">⚪</div>
    <div class="nav-btn" onclick="closeApp()">◀</div>
  </footer>

  <!-- App Window Modal -->
  <section id="app-modal">
    <div class="modal-hdr" id="modal-hdr">
      <button class="back-btn" onclick="closeApp()">‹ Back</button>
      <h3 id="modal-title">App</h3>
      <div style="width: 40px;"></div>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </section>

  <!-- Script Runtime Engine -->
  <script>
    // Real-Time Clock
    function updateClock() {
      const d = new Date();
      const h = String(d.getHours()).padStart(2, '0');
      const m = String(d.getMinutes()).padStart(2, '0');
      const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
      const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      const timeStr = `${h}:${m}`;
      const dateStr = `${days[d.getDay()]}, ${months[d.getMonth()]} ${d.getDate()}`;

      document.getElementById('top-time').innerText = timeStr;
      document.getElementById('main-clock').innerText = timeStr;
      document.getElementById('main-date').innerText = dateStr;
    }
    updateClock();
    setInterval(updateClock, 1000);

    let mediaStream = null;
    let calcBuffer = '';
    let dialStr = '';

    function filterApps() {
      const q = document.getElementById('app-search').value.toLowerCase();
      document.querySelectorAll('#home-grid .app-item').forEach(item => {
        const label = item.querySelector('.label').innerText.toLowerCase();
        item.style.display = label.includes(q) ? 'flex' : 'none';
      });
    }

    function openApp(name) {
      const modal = document.getElementById('app-modal');
      const hdr = document.getElementById('modal-hdr');
      const title = document.getElementById('modal-title');
      const body = document.getElementById('modal-body');

      modal.classList.add('active');
      hdr.style.display = 'flex';
      body.style.padding = '18px';
      title.innerText = name.toUpperCase();

      switch(name) {
        case 'camera':
          hdr.style.display = 'none';
          body.style.padding = '0';
          body.innerHTML = `
            <div class="cam-box">
              <div style="padding:14px 20px; display:flex; justify-content:space-between; z-index:10; background:linear-gradient(180deg, rgba(0,0,0,0.7), transparent);">
                <span style="color:#fff; font-size:18px;">⚡</span>
                <span style="color:#fff; font-weight:600;">HDR</span>
                <button onclick="closeApp()" style="background:transparent; border:none; color:#fff; font-size:18px; cursor:pointer;">✕</button>
              </div>
              <div class="cam-feed-area">
                <video id="cam-video" autoplay playsinline muted></video>
              </div>
              <div class="cam-controls">
                <img id="cam-thumb" onclick="openApp('photos')" style="width:50px; height:50px; border-radius:14px; object-fit:cover; border:2px solid #fff; background:#222;" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='50' height='50' fill='%23333'><rect width='50' height='50'/></svg>">
                <button onclick="takeSnapshot()" class="shutter"><div class="shutter-inner"></div></button>
                <button onclick="flipCam()" style="width:50px; height:50px; border-radius:50%; background:#222; border:1px solid #444; color:#fff; font-size:20px;">🔄</button>
              </div>
            </div>
            <canvas id="cam-cvs" style="display:none;"></canvas>
          `;
          startCam();
          break;

        case 'files':
          body.innerHTML = `
            <div class="card">
              <h4 style="color:#38bdf8;">Internal Storage</h4>
              <p style="color:#94a3b8; font-size:12px; margin-top:4px;">42 GB / 128 GB Used</p>
              <div style="width:100%; height:6px; background:#222; border-radius:3px; margin-top:8px; overflow:hidden;">
                <div style="width:33%; height:100%; background:#22c55e;"></div>
              </div>
            </div>
            <div class="card">
              <div class="card-item"><span>📄 Documents</span><span style="color:#94a3b8;">24 files ›</span></div>
              <div class="card-item" onclick="openApp('photos')"><span>🖼️ Gallery</span><span style="color:#94a3b8;">186 photos ›</span></div>
              <div class="card-item"><span>⬇️ Downloads</span><span style="color:#94a3b8;">12 files ›</span></div>
              <div class="card-item"><span>🎵 Audio</span><span style="color:#94a3b8;">8 tracks ›</span></div>
            </div>
          `;
          break;

        case 'drivers':
          body.innerHTML = `
            <div class="card">
              <h4 style="color:#38bdf8;">Kernel Driver Bridges</h4>
              <p style="font-size:12px; color:#94a3b8; margin-top:4px;">Nexus 6.1 LTS Kernel Active</p>
            </div>
            <div class="card">
              <div class="card-item"><span>📷 Camera Sensor</span><b style="color:#22c55e;">Online</b></div>
              <div class="card-item"><span>🎙️ Audio DAC Driver</span><b style="color:#22c55e;">48kHz Hi-Res</b></div>
              <div class="card-item"><span>🧭 IMU Gyroscope</span><b style="color:#22c55e;">Calibrated</b></div>
              <div class="card-item"><span>⚡ GPU Pipeline</span><b style="color:#22c55e;">120Hz Native</b></div>
              <div class="card-item"><span>📶 5G Modem Subsystem</span><b style="color:#22c55e;">Active</b></div>
            </div>
          `;
          break;

        case 'calc':
          calcBuffer = '';
          body.innerHTML = `
            <div class="calc-screen" id="calc-view">0</div>
            <div class="calc-grid">
              <button class="calc-btn" onclick="calcKey('C')">C</button>
              <button class="calc-btn" onclick="calcKey('DEL')">⌫</button>
              <button class="calc-btn op" onclick="calcKey('/')">/</button>
              <button class="calc-btn op" onclick="calcKey('*')">×</button>
              <button class="calc-btn" onclick="calcKey('7')">7</button>
              <button class="calc-btn" onclick="calcKey('8')">8</button>
              <button class="calc-btn" onclick="calcKey('9')">9</button>
              <button class="calc-btn op" onclick="calcKey('-')">-</button>
              <button class="calc-btn" onclick="calcKey('4')">4</button>
              <button class="calc-btn" onclick="calcKey('5')">5</button>
              <button class="calc-btn" onclick="calcKey('6')">6</button>
              <button class="calc-btn op" onclick="calcKey('+')">+</button>
              <button class="calc-btn" onclick="calcKey('1')">1</button>
              <button class="calc-btn" onclick="calcKey('2')">2</button>
              <button class="calc-btn" onclick="calcKey('3')">3</button>
              <button class="calc-btn op" onclick="calcKey('=')">=</button>
            </div>
          `;
          break;

        case 'notes':
          const saved = localStorage.getItem('nexus_notes') || '';
          body.innerHTML = `<textarea oninput="localStorage.setItem('nexus_notes', this.value)" style="width:100%; height:65vh; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); border-radius:14px; padding:14px; color:#fff; font-size:16px; resize:none;" placeholder="Type notes here...">${saved}</textarea>`;
          break;

        case 'settings':
          body.innerHTML = `
            <div class="card">
              <div class="card-item"><span>Device Name</span><b style="color:#38bdf8;">Nexus Alpha</b></div>
              <div class="card-item"><span>OS Version</span><b>Nexus OS 2.5</b></div>
              <div class="card-item"><span>Processor</span><b>MediaTek Dimensity 7400</b></div>
              <div class="card-item"><span>RAM</span><b>8.00 GB</b></div>
              <div class="card-item"><span>Storage</span><b>128 GB</b></div>
            </div>
          `;
          break;

        default:
          body.innerHTML = `
            <div style="text-align:center; padding:60px 0;">
              <h2>${name}</h2>
              <p style="color:#94a3b8; margin-top:8px;">Running smoothly on Nexus OS.</p>
            </div>
          `;
      }
    }

    function closeApp() {
      const modal = document.getElementById('app-modal');
      modal.classList.remove('active');
      if (mediaStream) {
        mediaStream.getTracks().forEach(t => t.stop());
        mediaStream = null;
      }
    }

    // Camera Handlers
    let currentFacing = 'environment';
    function startCam() {
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices.getUserMedia({ video: { facingMode: currentFacing } })
          .then(stream => {
            mediaStream = stream;
            const v = document.getElementById('cam-video');
            if (v) v.srcObject = stream;
          })
          .catch(() => alert('Allow Camera Access.'));
      }
    }
    function flipCam() {
      currentFacing = currentFacing ==
