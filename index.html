<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nexus Mobile WebOS</title>
  <style>
    :root {
      --bg: #090d16;
      --glass: rgba(22, 30, 49, 0.75);
      --glass-border: rgba(255, 255, 255, 0.1);
      --primary: #38bdf8;
      --accent: #818cf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: radial-gradient(circle at top right, #1e1b4b, #0f172a, #020617);
      color: var(--text);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #phone-screen {
      width: 100%;
      max-width: 440px;
      height: 100%;
      max-height: 920px;
      background: #020617;
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0,0,0,0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    @media (min-width: 500px) {
      #phone-screen {
        border-radius: 40px;
        height: 90vh;
      }
    }

    .status-bar {
      height: 38px;
      padding: 0 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text);
      z-index: 50;
    }

    .status-icons {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .home-screen {
      flex: 1;
      padding: 1.5rem 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      z-index: 10;
    }

    .widget-card {
      background: var(--glass);
      backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 1.5rem;
      padding: 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    }

    .widget-time {
      font-size: 2.2rem;
      font-weight: 700;
      line-height: 1;
      background: linear-gradient(135deg, #fff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .widget-date {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 0.35rem;
    }

    .widget-badge {
      background: rgba(56, 189, 248, 0.15);
      color: var(--primary);
      padding: 0.35rem 0.75rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .app-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1.25rem 0.75rem;
      margin: auto 0;
      text-align: center;
    }

    .app-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .app-item:active {
      transform: scale(0.9);
    }

    .app-icon {
      width: 58px;
      height: 58px;
      border-radius: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.6rem;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      position: relative;
    }

    .app-name {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text);
    }

    .dock-container {
      background: var(--glass);
      backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 0.75rem;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .app-window {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #090d16;
      z-index: 100;
      display: flex;
      flex-direction: column;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
    }

    .app-window.active {
      transform: translateY(0);
    }

    .window-header {
      height: 50px;
      padding: 0 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--glass-border);
      background: #111827;
    }

    .window-title {
      font-size: 1rem;
      font-weight: 600;
    }

    .window-body {
      flex: 1;
      overflow-y: auto;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .home-bar-container {
      height: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: transparent;
      z-index: 150;
      cursor: pointer;
    }

    .home-bar {
      width: 130px;
      height: 4px;
      background: rgba(255, 255, 255, 0.5);
      border-radius: 10px;
      transition: background 0.2s;
    }

    input, textarea {
      width: 100%;
      padding: 0.75rem;
      background: #1e293b;
      border: 1px solid var(--glass-border);
      border-radius: 0.5rem;
      color: #fff;
      outline: none;
      font-size: 0.95rem;
    }

    button.ui-btn {
      padding: 0.75rem;
      background: var(--primary);
      color: #090d16;
      border: none;
      border-radius: 0.5rem;
      font-weight: 600;
      cursor: pointer;
    }

    .calc-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.5rem;
    }
    .calc-btn {
      padding: 1rem;
      font-size: 1.2rem;
      background: #1e293b;
      color: #fff;
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      cursor: pointer;
    }
    .calc-btn.op {
      background: var(--primary);
      color: #090d16;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <div id="phone-screen">
    <div class="status-bar">
      <span id="statusClock">12:00</span>
      <div class="status-icons">
        <span>5G</span>
        <span>📶</span>
        <span>🔋 100%</span>
      </div>
    </div>

    <div class="home-screen">
      <div class="widget-card">
        <div>
          <div class="widget-time" id="widgetClock">12:00</div>
          <div class="widget-date" id="widgetDate">Saturday, Aug 15</div>
        </div>
        <div class="widget-badge">Nexus OS 1.0</div>
      </div>

      <div class="app-grid">
        <div class="app-item" onclick="openApp('appMail')">
          <div class="app-icon" style="background: linear-gradient(135deg, #0284c7, #2563eb);">📬</div>
          <div class="app-name">Temp Mail</div>
        </div>

        <div class="app-item" onclick="openApp('appNotes')">
          <div class="app-icon" style="background: linear-gradient(135deg, #f59e0b, #d97706);">📝</div>
          <div class="app-name">Notes</div>
        </div>

        <div class="app-item" onclick="openApp('appCalc')">
          <div class="app-icon" style="background: linear-gradient(135deg, #10b981, #059669);">🔢</div>
          <div class="app-name">Calc</div>
        </div>

        <div class="app-item" onclick="location.href='watch.html'">
          <div class="app-icon" style="background: linear-gradient(135deg, #ec4899, #8b5cf6);">⌚</div>
          <div class="app-name">Watch</div>
        </div>

        <div class="app-item" onclick="openApp('appTerminal')">
          <div class="app-icon" style="background: linear-gradient(135deg, #1e293b, #0f172a); border: 1px solid var(--glass-border);">💻</div>
          <div class="app-name">Terminal</div>
        </div>

        <div class="app-item" onclick="openApp('appSettings')">
          <div class="app-icon" style="background: linear-gradient(135deg, #64748b, #475569);">⚙️</div>
          <div class="app-name">Settings</div>
        </div>
      </div>

      <div class="dock-container">
        <div class="app-item" onclick="openApp('appMail')">
          <div class="app-icon" style="width: 50px; height: 50px; background: linear-gradient(135deg, #0284c7, #2563eb);">📬</div>
        </div>
        <div class="app-item" onclick="openApp('appNotes')">
          <div class="app-icon" style="width: 50px; height: 50px; background: linear-gradient(135deg, #f59e0b, #d97706);">📝</div>
        </div>
        <div class="app-item" onclick="location.href='watch.html'">
          <div class="app-icon" style="width: 50px; height: 50px; background: linear-gradient(135deg, #ec4899, #8b5cf6);">⌚</div>
        </div>
      </div>
    </div>

    <!-- App 1: Temp Mail -->
    <div class="app-window" id="appMail">
      <div class="window-header">
        <span class="window-title">📬 Disposable Temp Mail</span>
        <button class="ui-btn" style="padding: 0.3rem 0.8rem;" onclick="closeActiveApp()">✕</button>
      </div>
      <div class="window-body">
        <input type="text" id="osMailInput" readonly value="Generating...">
        <button class="ui-btn" onclick="copyMail()">Copy Email</button>
        <button class="ui-btn" style="background:#1e293b; color:#fff;" onclick="genNewMail()">Generate New</button>
      </div>
    </div>

    <!-- App 2: Notes -->
    <div class="app-window" id="appNotes">
      <div class="window-header">
        <span class="window-title">📝 Quick Notes</span>
        <button class="ui-btn" style="padding: 0.3rem 0.8rem;" onclick="closeActiveApp()">✕</button>
      </div>
      <div class="window-body">
        <textarea id="noteInput" rows="12" placeholder="Type notes here..."></textarea>
        <button class="ui-btn" onclick="saveNote()">Save Note</button>
      </div>
    </div>

    <!-- App 3: Calculator -->
    <div class="app-window" id="appCalc">
      <div class="window-header">
        <span class="window-title">🔢 Calculator</span>
        <button class="ui-btn" style="padding: 0.3rem 0.8rem;" onclick="closeActiveApp()">✕</button>
      </div>
      <div class="window-body">
        <input type="text" id="calcDisplay" readonly value="0" style="font-size:2rem; text-align:right;">
        <div class="calc-grid">
          <button class="calc-btn" onclick="clearCalc()">C</button>
          <button class="calc-btn" onclick="pressCalc('/')">/</button>
          <button class="calc-btn" onclick="pressCalc('*')">*</button>
          <button class="calc-btn op" onclick="pressCalc('-')">-</button>
          <button class="calc-btn" onclick="pressCalc('7')">7</button>
          <button class="calc-btn" onclick="pressCalc('8')">8</button>
          <button class="calc-btn" onclick="pressCalc('9')">9</button>
          <button class="calc-btn op" onclick="pressCalc('+')">+</button>
          <button class="calc-btn" onclick="pressCalc('4')">4</button>
          <button class="calc-btn" onclick="pressCalc('5')">5</button>
          <button class="calc-btn" onclick="pressCalc('6')">6</button>
          <button class="calc-btn op" onclick="evalCalc()">=</button>
          <button class="calc-btn" onclick="pressCalc('1')">1</button>
          <button class="calc-btn" onclick="pressCalc('2')">2</button>
          <button class="calc-btn" onclick="pressCalc('3')">3</button>
          <button class="calc-btn" onclick="pressCalc('0')">0</button>
        </div>
      </div>
    </div>

    <!-- App 4: Terminal -->
    <div class="app-window" id="appTerminal">
      <div class="window-header">
        <span class="window-title">💻 Nexus Terminal</span>
        <button class="ui-btn" style="padding: 0.3rem 0.8rem;" onclick="closeActiveApp()">✕</button>
      </div>
      <div class="window-body" style="background:#000; font-family:monospace;">
        <div id="termOutput" style="font-size:0.85rem; color:#4ade80; white-space:pre-wrap;">Nexus OS Ready. Type 'help'.</div>
        <form onsubmit="runTerm(event)" style="display:flex; gap:0.5rem;">
          <span style="color:#38bdf8;">$</span>
          <input type="text" id="termInput" style="background:transparent; border:none; padding:0;" autocomplete="off">
        </form>
      </div>
    </div>

    <!-- App 5: Settings -->
    <div class="app-window" id="appSettings">
      <div class="window-header">
        <span class="window-title">⚙️ Settings</span>
        <button class="ui-btn" style="padding: 0.3rem 0.8rem;" onclick="closeActiveApp()">✕</button>
      </div>
      <div class="window-body">
        <div><strong>Device:</strong> Nexus Phone OS</div>
        <div><strong>Companion:</strong> <a href="watch.html" style="color:#38bdf8;">Open Watch OS</a></div>
      </div>
    </div>

    <div class="home-bar-container" onclick="closeActiveApp()">
      <div class="home-bar"></div>
    </div>
  </div>

  <script>
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const mins = String(now.getMinutes()).padStart(2, '0');
      const timeStr = `${hours}:${mins}`;
      document.getElementById('statusClock').innerText = timeStr;
      document.getElementById('widgetClock').innerText = timeStr;
      document.getElementById('widgetDate').innerText = now.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    }
    setInterval(updateClock, 1000);
    updateClock();

    let activeAppId = null;
    function openApp(id) {
      activeAppId = id;
      document.getElementById(id).classList.add('active');
    }
    function closeActiveApp() {
      if (activeAppId) {
        document.getElementById(activeAppId).classList.remove('active');
        activeAppId = null;
      }
    }

    let calcVal = '0';
    function pressCalc(ch) {
      calcVal = calcVal === '0' ? ch : calcVal + ch;
      document.getElementById('calcDisplay').value = calcVal;
    }
    function clearCalc() {
      calcVal = '0';
      document.getElementById('calcDisplay').value = '0';
    }
    function evalCalc() {
      try { calcVal = String(eval(calcVal)); document.getElementById('calcDisplay').value = calcVal; }
      catch(e) { document.getElementById('calcDisplay').value = 'Error'; }
    }

    document.getElementById('noteInput').value = localStorage.getItem('nexus_notes') || '';
    function saveNote() {
      localStorage.setItem('nexus_notes', document.getElementById('noteInput').value);
      alert('Saved!');
    }

    function runTerm(e) {
      e.preventDefault();
      const input = document.getElementById('termInput');
      const out = document.getElementById('termOutput');
      out.innerText += `\n$ ${input.value}\nCommand executed.`;
      input.value = '';
    }

    let mailLogin = 'user_' + Math.random().toString(36).substring(2, 8);
    document.getElementById('osMailInput').value = `${mailLogin}@1secmail.com`;
    function genNewMail() {
      mailLogin = 'user_' + Math.random().toString(36).substring(2, 8);
      document.getElementById('osMailInput').value = `${mailLogin}@1secmail.com`;
    }
    function copyMail() {
      navigator.clipboard.writeText(document.getElementById('osMailInput').value);
      alert('Copied!');
    }
  </script>
</body>
</html>
