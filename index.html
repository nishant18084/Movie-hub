<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Refrigerator AI Assistant</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }
        .chat-container {
            width: 100%;
            max-width: 480px;
            height: 85vh;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-header {
            background: #0284c7;
            color: white;
            padding: 16px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: 600;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .chat-box {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background-color: #f8fafc;
        }
        .message {
            max-width: 82%;
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 0.95rem;
            line-height: 1.5;
            word-wrap: break-word;
            white-space: pre-wrap;
        }
        .user-message {
            background: #0284c7;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .bot-message {
            background: #e2e8f0;
            color: #1e293b;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .suggestions {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 8px 16px;
            background: #ffffff;
            border-top: 1px solid #e2e8f0;
        }
        .chip {
            background: #f1f5f9;
            color: #0369a1;
            border: 1px solid #cbd5e1;
            padding: 6px 12px;
            border-radius: 16px;
            font-size: 0.8rem;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s;
        }
        .chip:hover {
            background: #e0f2fe;
            border-color: #0284c7;
        }
        .input-area {
            display: flex;
            padding: 12px;
            background: #ffffff;
            border-top: 1px solid #e2e8f0;
            gap: 8px;
        }
        input {
            flex: 1;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            outline: none;
            font-size: 0.95rem;
        }
        input:focus {
            border-color: #0284c7;
        }
        button {
            padding: 12px 18px;
            background: #0284c7;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #0369a1;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <span>🧊</span> Smart Fridge AI Assistant
    </div>
    
    <div class="chat-box" id="chatBox">
        <div class="message bot-message">
Namaste! Main aapka Refrigerator Assistant hun. 

Aap mujhe bataiye:
1. Fridge me kya-kya samaan rakha hai? (Main recipe suggest karunga)
2. Fridge care ya troubleshooting tips chahiye?
        </div>
    </div>

    <!-- Quick Suggestion Chips -->
    <div class="suggestions">
        <div class="chip" onclick="quickSend('Doodh, Aloo, Paneer aur Tamatar se kya banayein?')">🥗 Recipe Suggestions</div>
        <div class="chip" onclick="quickSend('Fridge ka ideal temperature kitna hona chahiye?')">🌡️ Temperature Info</div>
        <div class="chip" onclick="quickSend('Fridge me badboo dur karne ke tarike?')">🧹 Cleaning Tips</div>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Yahan apna sawaal ya ingredients likhein..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">Bhejein</button>
    </div>
</div>

<script>
    // GitHub Actions deployment ke waqt '__API_KEY__' aapke GitHub Secret (GEMINI_API_KEY) se replace ho jayega
    const API_KEY = '__API_KEY__';

    async function sendMessage() {
        const inputField = document.getElementById('userInput');
        const userText = inputField.value.trim();
        if (!userText) return;

        appendMessage(userText, 'user-message');
        inputField.value = '';

        const loadingDiv = appendMessage('Soch raha hun...', 'bot-message');

        try {
            const responseText = await fetchAIResponse(userText);
            loadingDiv.innerText = responseText;
        } catch (error) {
            console.error(error);
            loadingDiv.innerText = "Koshish karein dobara. API se jawab nahi mil paya.";
        }
    }

    function quickSend(text) {
        document.getElementById('userInput').value = text;
        sendMessage();
    }

    function appendMessage(text, className) {
        const chatBox = document.getElementById('chatBox');
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${className}`;
        msgDiv.innerText = text;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
        return msgDiv;
    }

    function handleKeyPress(e) {
        if (e.key === 'Enter') sendMessage();
    }

    async function fetchAIResponse(userPrompt) {
        if (API_KEY === '__API_KEY__' || !API_KEY) {
            return "API Key configure nahi hui hai. Kripya GitHub Workflow check karein.";
        }

        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;

        const systemPrompt = "Aap ek expert Refrigerator Assistant hain. Aap user ko fridge me rakhe samaan ke basis par quick recipes, storage tips, ya troubleshooting help dete hain. Aapka uttar aasan aur clear Hindi (Hinglish mix) me hona chahiye.";

        const response = await fetch(url, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                contents: [{
                    parts: [{
                        text: `${systemPrompt}\n\nUser: ${userPrompt}`
                    }]
                }]
            })
        });

        const data = await response.json();

        if (data.candidates && data.candidates[0] && data.candidates[0].content.parts[0].text) {
            return data.candidates[0].content.parts[0].text;
        } else {
            return "Koshish karein dobara. API Response sahi nahi mila.";
        }
    }
</script>

</body>
</html>
