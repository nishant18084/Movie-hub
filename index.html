<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus OS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Boot Screen (Hello Animation) -->
    <div id="boot-screen">
        <svg class="hello-svg" viewBox="0 0 300 120">
            <text x="50%" y="65%" text-anchor="middle" class="hello-text">hello</text>
        </svg>
    </div>

    <!-- Home Screen -->
    <div id="main-os">
        <div class="os-container">
            <div class="status-bar">
                <span id="live-status-time">--:--</span>
                <span>5G • 100%</span>
            </div>
            <div class="time-card">
                <div>
                    <h1 id="live-clock">--:--</h1>
                    <p id="live-date">Loading...</p>
                </div>
            </div>
            
            <div class="grid">
                <div class="app-item" onclick="openApp('app-weather')">
                    <div class="icon" style="background:#38bdf8;">☀️</div>
                    <span class="label">Weather</span>
                </div>
                <div class="app-item" onclick="openApp('app-notes')">
                    <div class="icon" style="background:#eab308;">📝</div>
                    <span class="label">Notes</span>
                </div>
            </div>
        </div>
    </div>

    <!-- App Windows System (Hidden by default) -->
    <div id="app-window" class="app-hidden">
        <div class="window-header">
            <button onclick="closeApp()">Back</button>
            <span id="window-title">App Name</span>
        </div>
        <div class="window-content" id="window-content">
            <!-- App Content will inject here -->
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
